<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC SR | 權限管理</title>
  <meta name="theme-color" content="#007E8A">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg?v=sr-icon-20261109-v2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=sr-icon-20261109-v2">
  <script>(function(){const s=localStorage.getItem('theme'),m=matchMedia('(prefers-color-scheme:dark)');document.documentElement.classList.toggle('dark',s==='dark'||(s!=='light'&&m.matches));})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','"Noto Sans TC"','sans-serif']},colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html{font-size:15px;font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif}
    body{margin:0;-webkit-font-smoothing:antialiased}
    .field{background:#161924;border:1px solid #334155;border-radius:10px;padding:10px 11px;width:100%;font-size:14px;color:#f1f5f9}
    .field:focus{outline:2px solid #007E8A;outline-offset:1px}
    html:not(.dark) .field{background:#fff;border-color:#cbd5e1;color:#1e293b}
    .btn{border-radius:10px;padding:8px 11px;border:1px solid #475569;font-size:12px;font-weight:700;min-height:36px;cursor:pointer}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:#007E8A;color:white;border-color:#007E8A}
    .btn-ghost{border-color:rgba(148,163,184,.5)}
    .btn-danger{color:#f87171;border-color:rgba(244,63,94,.5)}
    html:not(.dark) .btn-danger{color:#be123c}
  </style>
  <!-- SR 共用 Header 全寬：只調整容器，不修改登入或 Firebase 邏輯。 -->
  <style id="sr-header-full-width">
    html body #clc-header > div {
      width: 100% !important;
      max-width: none !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-[#090A0F] dark:text-slate-100">
  <header id="clc-header"></header>
  <main class="max-w-3xl mx-auto px-4 py-7 space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-extrabold">👤 權限管理</h1>
      <a href="index.html" class="text-sm font-bold text-[#007E8A] dark:text-teal-300 hover:underline">← 返回首頁</a>
    </div>
    <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">參照 YA 的權限後台操作：新增帳號、指定角色、變更權限、啟用、停用及移除授權。SR 仍保留區長與小組長專用權限，與 YA 資料庫完全獨立。</p>
    <div id="access" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4 text-sm" role="status">正在驗證 SR 管理員身分…</div>
    <section id="mainPanel" class="hidden space-y-5">
      <form id="addForm" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4 space-y-3">
        <h2 class="font-bold">新增授權同工</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">對方不必先登入；預先指派 Email 後，首次使用相同 Google 帳號登入即可建立自己的 UID 權限文件。此功能不會建立 Google 密碼或寄送邀請信。</p>
        <div class="grid sm:grid-cols-2 gap-3">
          <label class="text-sm block">Google Email<input class="field mt-1" id="newEmail" type="email" placeholder="name@example.com" required autocomplete="off"></label>
          <label class="text-sm block">姓名（選填）<input class="field mt-1" id="newName" placeholder="同工姓名" maxlength="80"></label>
        </div>
        <div class="grid sm:grid-cols-2 gap-3">
          <label class="text-sm block">權限等級
            <select class="field mt-1" id="newRole">
              <option value="viewer">檢視者（唯讀）</option>
              <option value="group_leader">小組長</option>
              <option value="district_leader">區長</option>
              <option value="admin">管理員（可管理 SR）</option>
            </select>
          </label>
          <label id="newScopeWrap" class="text-sm hidden">所屬範圍（必填）<input id="newScope" class="field mt-1" placeholder="牧區或小組 ID／名稱" maxlength="120"></label>
        </div>
        <label class="flex items-center gap-2 text-sm"><input id="newActive" type="checkbox" checked class="accent-[#007E8A]">新增後立即啟用帳號</label>
        <button class="btn btn-primary" type="submit">＋ 新增授權</button>
      </form>
      <section class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4 space-y-3">
        <div class="flex items-center justify-between gap-3"><h2 class="font-bold">同工與管理員名單</h2><span id="usersCount" class="text-xs text-slate-500 dark:text-slate-400"></span></div>
        <p id="usersListStatus" role="status" aria-live="polite" class="text-xs text-slate-500 dark:text-slate-400"></p>
        <div id="usersList" class="space-y-2"></div>
      </section>
      <p class="text-xs text-slate-500 dark:text-slate-400">固定初始 Superuser 不可降權、停用或移除。刪除一般同工只會撤銷 SR 的應用程式授權，不會刪除其 Google 帳號。SR 不使用 YA 的每日 09:00 郵件通知。</p>
    </section>
  </main>
  <script src="header.js?v=20261109-sr-v2"></script>
  <script src="admin-users.js?v=20261109-sr-v2"></script>
</body></html>
