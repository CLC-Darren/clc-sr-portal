<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC SR | 權限管理</title>
  <meta name="theme-color" content="#007E8A">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg?v=sr-icon-20261109-v2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=sr-icon-20261109-v2">
  <script>(function(){const s='dark',m=matchMedia('(prefers-color-scheme:dark)');document.documentElement.classList.toggle('dark',s==='dark'||(s!=='light'&&m.matches));})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','"Noto Sans TC"','sans-serif']},colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html{font-size:15px;font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif}
    body{margin:0;-webkit-font-smoothing:antialiased}
    .field{background:#161924;border:1px solid #334155;border-radius:10px;padding:10px 11px;width:100%;font-size:14px;color:#f1f5f9}
    .field:focus{outline:2px solid #007E8A;outline-offset:1px}
    html:not(.dark) .field{background:#fff;border-color:#cbd5e1;color:#1e293b}
    .btn{border-radius:10px;padding:8px 11px;border:1px solid #475569;font-size:12px;font-weight:700;min-height:36px;cursor:pointer}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:#007E8A;color:white;border-color:#007E8A}
    .btn-ghost{border-color:rgba(148,163,184,.5)}
    .btn-danger{color:#f87171;border-color:rgba(244,63,94,.5)}
    html:not(.dark) .btn-danger{color:#be123c}
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-[#090A0F] dark:text-slate-100">
  <header id="clc-header"></header>
  <main class="max-w-3xl mx-auto px-4 py-7 space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-extrabold">👤 權限管理</h1>
      <a href="index.html" class="text-sm font-bold text-[#007E8A] dark:text-teal-300 hover:underline">← 返回首頁</a>
    </div>
    <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">新增授權管理員。新增者需使用相同 Google Email 登入；此處不會建立 Google 密碼或寄送邀請信。</p>
    <div id="access" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4 text-sm" role="status">正在驗證管理員身分…</div>
    <section id="mainPanel" class="hidden space-y-5">
      <div id="viewerNote" class="hidden rounded-xl p-3 border border-sky-500/30 bg-sky-500/10 text-sm text-sky-600 dark:text-sky-300">👁️ 目前為唯讀檢視權限：可查看管理員名單，無法新增或修改。</div>
      <form id="addForm" class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4 space-y-3">
        <h2 class="font-bold">新增管理員</h2>
        <label class="text-sm block">Google 帳號 Email<input class="field mt-1" id="newEmail" type="email" placeholder="name@example.com" required autocomplete="off"></label>
        <label class="text-sm block">權限等級
          <select class="field mt-1" id="newRole">
            <option value="admin">管理員（可編輯）</option>
            <option value="viewer">檢視者（唯讀，可看後台但不能修改）</option>
          </select>
        </label>
        <label class="flex gap-2 items-center text-sm"><input id="newNotify" type="checkbox" class="accent-[#007E8A]">接收審核 Email（保留選項，尚未串接）</label>
        <button class="btn btn-primary" type="submit">＋ 新增管理員</button>
      </form>
      <section class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161924] p-4">
        <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-bold">管理員名單</h2><span id="usersCount" class="text-xs text-slate-500 dark:text-slate-400"></span></div>
        <p id="usersListStatus" role="status" aria-live="polite" class="text-xs text-slate-500 dark:text-slate-400 mb-3"></p>
        <div id="usersList" class="space-y-2 text-sm"></div>
      </section>
      <p class="text-xs text-slate-500 dark:text-slate-400">SR 目前沒有需要審核的項目，「接收審核 Email」僅先保存設定，日後串接審核功能後才會生效。固定初始 Superuser 不可降權、停用或刪除。</p>
    </section>
  </main>
  <script src="header.js?v=20261111-gear"></script>
  <script src="admin-users.js?v=20261110-ya-auth"></script>
</body></html>
