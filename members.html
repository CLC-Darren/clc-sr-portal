<!DOCTYPE html>
<html lang="zh-TW" class="dark sr-members">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC SR | 組員通訊錄</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="favicon.svg?v=sr-icon-20261109-v2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=sr-icon-20261109-v2">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','"Noto Sans TC"','sans-serif']},colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sr-ui.css?v=20261111d">
  <link rel="stylesheet" href="css/sr-roster.css?v=20261112">
</head>
<body class="min-h-screen bg-[#090A0F] text-slate-100" data-mode="members">
  <header id="clc-header"></header>

  <main class="max-w-[1500px] mx-auto px-4 lg:px-6 pt-4 pb-10">
    <!-- 權限檢查 -->
    <section id="gateChecking" class="rounded-2xl bg-[#1C1C1E] p-6 text-center" role="status">正在確認登入身分…</section>
    <section id="gateLogin" class="hidden rounded-2xl bg-[#1C1C1E] p-8 text-center space-y-4">
      <p class="text-lg font-bold">通訊錄含有個人資料，請先登入。</p>
      <p class="text-sm text-slate-400">需使用已授權的 Google 帳號。如果還沒有權限，請聯絡管理員。</p>
      <button type="button" class="m-btn m-btn-teal" onclick="triggerAdminLogin()">用 Google 帳號登入</button>
    </section>

    <section id="app" class="hidden">
      <!-- 工具列：電腦一排、手機分行 -->
      <div class="flex flex-col lg:flex-row lg:items-center gap-3 mb-4">
        <div class="flex items-center justify-between lg:justify-start gap-3">
          <div>
            <h1 class="text-[28px] lg:text-[22px] font-extrabold leading-tight whitespace-nowrap">組員通訊錄</h1>
            <p id="countLine" class="text-sm text-[rgba(235,235,245,.6)] lg:hidden" role="status" aria-live="polite"></p>
          </div>
          <div class="flex gap-2 lg:hidden">
            <button type="button" class="m-round bg-[#1C1C1E] text-[rgba(235,235,245,.85)]" data-export aria-label="下載 PDF 或 JPG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></button>
            <button type="button" class="m-round admin-only bg-[#007E8A] text-white" data-new aria-label="新增組員"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="relative"><button id="pageMenuGear" data-menu="members" type="button" onclick="togglePageMenu()" class="m-round bg-[#1C1C1E] text-[rgba(235,235,245,.85)]" aria-label="通訊錄選單"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
          </div>
        </div>

        <!-- 電腦版篩選 -->
        <div class="hidden lg:flex flex-nowrap items-center gap-2 flex-1 min-w-0">
          <label><span class="sr-only">大分類</span><select class="m-dark-field" data-filter="who"><option value="">全部小組</option><option>姊妹小組</option><option>弟兄小組</option><option>加樂同工</option><option>全職同工</option><option>未分組</option></select></label>
          <button type="button" class="m-btn m-dark-btn" data-export aria-haspopup="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>下載</button>
          <span class="flex-1"></span>
          <label class="m-search" style="flex:0 1 300px;min-width:150px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only">搜尋</span><input type="search" data-q placeholder="搜尋姓名、電話、地址、編號"></label>
          <button type="button" class="m-btn m-btn-teal admin-only" data-new>＋ 新增</button>
          <div class="relative" id="gearDesktopSlot"></div>
        </div>

        <!-- 手機版篩選 -->
        <div class="lg:hidden flex flex-col gap-3">
          <label class="m-search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only">搜尋</span><input type="search" data-q placeholder="搜尋姓名或電話"></label>
          <div class="grid grid-cols-3 gap-2">
            <label><span class="sr-only">身分</span><select class="m-dark-field w-full" data-filter="who"><option value="">全部小組</option><option>姊妹小組</option><option>弟兄小組</option><option>加樂同工</option><option>全職同工</option><option>未分組</option></select></label>
            <label><span class="sr-only">小組</span><select class="m-dark-field w-full" data-filter="group"></select></label>
            <label><span class="sr-only">狀態</span><select class="m-dark-field w-full" data-filter="status"></select></label>
          </div>
        </div>
      </div>

      <!-- 電腦版：表格＋檢閱器 -->
      <div class="hidden lg:flex gap-4 items-start" id="deskWrap">
        <section aria-label="名單" class="flex-1 min-w-0 bg-white rounded-[14px] overflow-hidden flex flex-col" style="height: calc(100vh - 150px)">
          <div class="flex-1 overflow-auto">
            <table class="m-table">
              <colgroup><col style="width:24%"><col style="width:7%"><col style="width:13%"><col style="width:17%"><col style="width:20%"><col style="width:19%"></colgroup>
              <thead><tr><th><button type="button" class="m-th" data-col="sortName"></button></th><th>性別</th><th><button type="button" class="m-th" data-col="sortBirth"></button></th><th>手機</th><th><button type="button" class="m-th" data-col="group"></button></th><th><button type="button" class="m-th" data-col="status"></button></th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
            <p id="tableEmpty" class="hidden text-center text-[#6E6E73] py-16"></p>
          </div>
          <div id="tableFoot" class="px-4 py-2.5 border-t border-[#EFEFF4] text-[13px] text-[#6E6E73]"></div>
        </section>
        <aside id="inspector" aria-label="個人資料" class="m-light hidden w-[360px] flex-none bg-[#F2F2F7] rounded-[14px] p-4 overflow-y-auto" style="height: calc(100vh - 150px)"></aside>
      </div>

      <!-- 手機版：卡片 -->
      <div id="cards" class="lg:hidden grid gap-2.5 sm:grid-cols-2"></div>
      <p id="cardsEmpty" class="lg:hidden hidden text-center text-[rgba(235,235,245,.6)] py-12"></p>
    </section>
  </main>
  <div id="colMenu" class="m-colmenu hidden" role="menu"></div>

  <!-- 手機：個人資料頁 -->
  <div id="sheet" class="m-sheet hidden" role="dialog" aria-modal="true" aria-label="個人資料">
    <div class="m-sheet-bar">
      <button type="button" class="m-link" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>通訊錄</button>
      <button type="button" class="m-link admin-only" id="sheetEdit">編輯</button>
    </div>
    <div id="sheetBody" class="m-light px-4 pb-10 max-w-xl mx-auto"></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" class="hidden">

  <script src="header.js?v=20261112-intakes"></script>
  <script src="js/sr-data.js?v=20261112b"></script>
  <script src="js/sr-export.js?v=20261112"></script>
  <script src="js/sr-roster.js?v=20261112c"></script>
</body>
</html>
