<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>CLC SR | 新朋友登記</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg?v=sr-icon-20261109-v2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=sr-icon-20261109-v2">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{teal:'#007E8A',border:'rgba(255,255,255,0.1)'}}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sr-ui.css?v=20261111">
</head>
<body class="min-h-screen bg-[#090A0F] text-slate-100">
  <header id="clc-header"></header>

  <main class="max-w-xl mx-auto px-4 pt-6 pb-16">
    <!-- 填寫畫面 -->
    <section id="formView">
      <div class="text-center space-y-2 mb-6">
        <div class="text-5xl" aria-hidden="true">🌱</div>
        <h1 class="text-[1.9rem] font-extrabold leading-tight">新朋友登記</h1>
        <p class="text-[1.02rem] text-slate-300 leading-relaxed">歡迎來到江翠加樂！<br>請留下您的資料，讓我們可以關心您。</p>
      </div>

      <div class="rounded-2xl border border-amber-400/40 bg-amber-400/10 text-amber-200 px-4 py-3 mb-5 text-[.95rem] font-bold" role="note">
        🛠️ 預覽版：目前按「送出」不會儲存資料。
      </div>

      <p class="sr-help mb-4"><span class="sr-req">＊</span>為必填</p>

      <form id="joinForm" novalidate class="space-y-4">
        <div class="sr-card p-4 sm:p-5" data-field="name">
          <label class="sr-label" for="fName">姓名<span class="sr-req">＊</span></label>
          <input class="sr-field" id="fName" name="name" autocomplete="name" maxlength="30" placeholder="請輸入姓名">
        </div>

        <div class="sr-card p-4 sm:p-5" data-field="gender">
          <span class="sr-label" id="lGender">性別<span class="sr-req">＊</span></span>
          <div class="grid grid-cols-2 gap-3" role="group" aria-labelledby="lGender" data-choice="gender">
            <button type="button" class="sr-choice" data-value="女">女</button>
            <button type="button" class="sr-choice" data-value="男">男</button>
          </div>
        </div>

        <div class="sr-card p-4 sm:p-5" data-field="birthday">
          <span class="sr-label" id="lBirth">生日<span class="sr-req">＊</span></span>
          <div class="grid grid-cols-[1.25fr_1fr_1fr] gap-2" role="group" aria-labelledby="lBirth">
            <label class="block">
              <span class="sr-help block mb-1">出生年</span>
              <input class="sr-field text-center" id="fYear" inputmode="numeric" maxlength="4" placeholder="例：45" aria-describedby="birthHint">
            </label>
            <label class="block">
              <span class="sr-help block mb-1">月</span>
              <select class="sr-field" id="fMonth"><option value="">月</option></select>
            </label>
            <label class="block">
              <span class="sr-help block mb-1">日</span>
              <select class="sr-field" id="fDay"><option value="">日</option></select>
            </label>
          </div>
          <p id="birthHint" class="sr-help mt-2">民國年或西元年都可以，例如「45」或「1956」。</p>
        </div>

        <div class="sr-card p-4 sm:p-5" data-field="mobile">
          <label class="sr-label" for="fMobile">手機<span class="sr-req">＊</span></label>
          <input class="sr-field" id="fMobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="0910-000-000">
        </div>

        <div class="sr-card p-4 sm:p-5">
          <label class="sr-label" for="fPhone">市話</label>
          <input class="sr-field" id="fPhone" type="tel" inputmode="tel" placeholder="02-0000-0000">
        </div>

        <div class="sr-card p-4 sm:p-5">
          <label class="sr-label" for="fAddress">地址</label>
          <input class="sr-field" id="fAddress" autocomplete="street-address" maxlength="120" placeholder="請輸入地址">
        </div>

        <div class="sr-card p-4 sm:p-5">
          <span class="sr-label" id="lMarital">婚姻</span>
          <div class="grid grid-cols-2 gap-3" role="group" aria-labelledby="lMarital" data-choice="marital" data-optional></div>
          <p class="sr-help mt-2">可不填；再點一次可取消。</p>
        </div>

        <div class="sr-card p-4 sm:p-5">
          <span class="sr-label" id="lLiving">居住狀況</span>
          <div class="grid grid-cols-2 gap-3" role="group" aria-labelledby="lLiving" data-choice="living" data-optional></div>
        </div>

        <div class="sr-card p-4 sm:p-5" data-field="group">
          <span class="sr-label" id="lGroup">關懷小組<span class="sr-req">＊</span></span>
          <div class="grid grid-cols-2 gap-2.5" role="group" aria-labelledby="lGroup" data-choice="group" id="groupChoices"></div>
          <button type="button" class="sr-choice mt-2.5" data-value="" data-choice-of="group" id="groupNone">暫不安排小組</button>
        </div>

        <div class="pt-2">
          <button type="submit" class="sr-btn sr-btn-primary w-full text-[1.15rem]" style="min-height:62px">送出資料</button>
        </div>
      </form>
    </section>

    <!-- 完成畫面 -->
    <section id="doneView" class="hidden text-center space-y-5 pt-6" tabindex="-1">
      <div class="text-6xl" aria-hidden="true">🙏</div>
      <h1 class="text-[1.9rem] font-extrabold">謝謝您！</h1>
      <p class="text-[1.05rem] text-slate-300">我們已經收到您的資料，<br>同工會再與您聯繫。</p>
      <p class="text-[.95rem] font-bold text-amber-200">（預覽版：這筆資料沒有儲存）</p>
      <dl id="summary" class="sr-card p-4 text-left space-y-2 text-[1rem]"></dl>
      <button type="button" id="againBtn" class="sr-btn sr-btn-ghost w-full">再登記一位</button>
    </section>
  </main>

  <script src="header.js?v=20261111-members"></script>
  <script src="js/sr-data.js?v=20261111"></script>
  <script>
  (function () {
    const SR = window.SR;
    const state = { gender: '', marital: '', living: '', group: null }; // group: null=未選、''=暫不安排
    let groups = SR.DEFAULT_GROUPS.map(name => ({ id: '', name }));
    let options = { marital: SR.DEFAULT_OPTIONS.marital, living: SR.DEFAULT_OPTIONS.living };

    const $ = id => document.getElementById(id);
    const fMonth = $('fMonth'), fDay = $('fDay'), fYear = $('fYear');
    for (let m = 1; m <= 12; m++) fMonth.add(new Option(m + ' 月', m));
    function fillDays() {
      const keep = fDay.value;
      const y = toWesternYear(fYear.value) || 2000, m = +fMonth.value || 1;
      const max = new Date(y, m, 0).getDate();
      fDay.length = 1;
      for (let d = 1; d <= max; d++) fDay.add(new Option(d + ' 日', d));
      if (keep && +keep <= max) fDay.value = keep;
    }
    fillDays();

    function toWesternYear(v) {
      const n = parseInt(String(v).replace(/[^\d]/g, ''), 10);
      if (!n) return 0;
      return n < 200 ? n + 1911 : n;
    }
    function updateBirthHint() {
      const y = toWesternYear(fYear.value);
      const hint = $('birthHint');
      if (!fYear.value) { hint.textContent = '民國年或西元年都可以，例如「45」或「1956」。'; return; }
      if (y < 1900 || y > new Date().getFullYear()) { hint.textContent = '年份好像不太對，請再確認一下。'; return; }
      const age = new Date().getFullYear() - y;
      hint.textContent = `民國 ${y - 1911} 年 ＝ 西元 ${y} 年（約 ${age} 歲）`;
    }
    fYear.addEventListener('input', () => { fYear.value = fYear.value.replace(/[^\d]/g, ''); updateBirthHint(); fillDays(); clearError('birthday'); });
    fMonth.addEventListener('change', () => { fillDays(); clearError('birthday'); });
    fDay.addEventListener('change', () => clearError('birthday'));

    ['fMobile', 'fPhone'].forEach(id => $(id).addEventListener('blur', e => { e.target.value = SR.formatPhone(e.target.value); }));
    $('fMobile').addEventListener('input', () => clearError('mobile'));
    $('fName').addEventListener('input', () => clearError('name'));

    // ---------- 大按鈕選項 ----------
    function renderChoices() {
      const box = name => document.querySelector(`[data-choice="${name}"]`);
      box('marital').innerHTML = options.marital.map(v => `<button type="button" class="sr-choice" data-value="${SR.esc(v)}">${SR.esc(v)}</button>`).join('');
      box('living').innerHTML = options.living.map(v => `<button type="button" class="sr-choice" data-value="${SR.esc(v)}">${SR.esc(v)}</button>`).join('');
      $('groupChoices').innerHTML = groups.map(g => `<button type="button" class="sr-choice" data-value="${SR.esc(g.name)}">${SR.esc(g.name.replace(/小組$/, ''))}<span class="text-[.85rem] font-bold opacity-75">小組</span></button>`).join('');
      syncPressed();
    }
    function syncPressed() {
      document.querySelectorAll('[data-choice]').forEach(boxEl => {
        const key = boxEl.dataset.choice;
        boxEl.querySelectorAll('.sr-choice').forEach(b => b.setAttribute('aria-pressed', String(state[key] === b.dataset.value)));
      });
      $('groupNone').setAttribute('aria-pressed', String(state.group === ''));
    }
    document.addEventListener('click', e => {
      const btn = e.target.closest('.sr-choice');
      if (!btn) return;
      const boxEl = btn.closest('[data-choice]');
      const key = boxEl ? boxEl.dataset.choice : btn.dataset.choiceOf;
      if (!key) return;
      const value = btn.dataset.value;
      const optional = boxEl && boxEl.hasAttribute('data-optional');
      state[key] = optional && state[key] === value ? '' : value;
      syncPressed();
      clearError(key);
    });
    renderChoices();

    // 小組與選項以後台設定為準；讀不到時使用表單原本的選項。
    try {
      SR.watchGroups(list => {
        const active = list.filter(g => g.active !== false);
        if (active.length) { groups = active; renderChoices(); }
      }, () => {});
      SR.watchOptions(o => { options = { marital: o.marital, living: o.living }; renderChoices(); }, () => {});
    } catch (e) { /* Firebase 尚未就緒：使用預設選項 */ }

    // ---------- 檢查與送出 ----------
    function setError(field, message) {
      const card = document.querySelector(`[data-field="${field}"]`);
      if (!card) return;
      clearError(field);
      const p = document.createElement('p');
      p.className = 'sr-error-text';
      p.dataset.err = '1';
      p.textContent = '⚠️ ' + message;
      card.appendChild(p);
      card.querySelectorAll('.sr-field').forEach(f => f.classList.add('sr-invalid'));
      card.style.borderColor = 'rgba(251,113,133,.6)';
    }
    function clearError(field) {
      const card = document.querySelector(`[data-field="${field}"]`);
      if (!card) return;
      card.querySelectorAll('[data-err]').forEach(n => n.remove());
      card.querySelectorAll('.sr-field').forEach(f => f.classList.remove('sr-invalid'));
      card.style.borderColor = '';
    }

    $('joinForm').addEventListener('submit', e => {
      e.preventDefault();
      const data = {
        name: $('fName').value.trim(),
        gender: state.gender,
        mobile: SR.formatPhone($('fMobile').value),
        phone: SR.formatPhone($('fPhone').value),
        address: $('fAddress').value.trim(),
        marital: state.marital,
        living: state.living,
        group: state.group
      };
      const y = toWesternYear(fYear.value);
      data.birthday = fYear.value && fMonth.value && fDay.value ? SR.parseBirthday(`${y}-${fMonth.value}-${fDay.value}`) : '';

      const errors = [];
      if (!data.name) errors.push(['name', '請填寫姓名']);
      if (!data.gender) errors.push(['gender', '請選擇性別']);
      if (!data.birthday) errors.push(['birthday', data.birthday === null || fYear.value ? '生日不完整或日期不正確' : '請填寫生日']);
      const digits = SR.phoneDigits(data.mobile);
      if (!digits) errors.push(['mobile', '請填寫手機號碼']);
      else if (!/^09\d{8}$/.test(digits)) errors.push(['mobile', '手機號碼應為 09 開頭的 10 碼數字']);
      if (data.group === null) errors.push(['group', '請選擇關懷小組，或選「暫不安排小組」']);

      errors.forEach(([f, m]) => setError(f, m));
      if (errors.length) {
        const first = document.querySelector(`[data-field="${errors[0][0]}"]`);
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const input = first.querySelector('input,select,button');
        if (input) setTimeout(() => input.focus({ preventScroll: true }), 350);
        SR.toast(`還有 ${errors.length} 個地方需要填寫`, 'error');
        return;
      }

      // TODO（第二階段）：寫入 intakes，並以 Cloudflare Turnstile 防止機器人。
      const rows = [
        ['姓名', data.name], ['性別', data.gender], ['生日', SR.formatRocLong(data.birthday)],
        ['手機', data.mobile], ['市話', data.phone], ['地址', data.address],
        ['婚姻', data.marital], ['居住狀況', data.living], ['關懷小組', data.group || '暫不安排小組']
      ].filter(r => r[1]);
      $('summary').innerHTML = rows.map(([k, v]) => `<div class="flex gap-3"><dt class="w-24 shrink-0 text-slate-400 font-bold">${k}</dt><dd class="font-bold break-all">${SR.esc(v)}</dd></div>`).join('');
      $('formView').classList.add('hidden');
      $('doneView').classList.remove('hidden');
      window.scrollTo(0, 0);
      $('doneView').focus();
    });

    $('againBtn').addEventListener('click', () => {
      $('joinForm').reset();
      Object.assign(state, { gender: '', marital: '', living: '', group: null });
      syncPressed(); fillDays(); updateBirthHint();
      $('doneView').classList.add('hidden');
      $('formView').classList.remove('hidden');
      window.scrollTo(0, 0);
    });
  })();
  </script>
</body>
</html>
