<!DOCTYPE html>
<html lang="zh-TW" class="dark"><head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#090A0F">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 10-12月加樂團契服事表</title>
  <link rel="icon" href="images/sr-serve-favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/sr-serve-apple-touch-icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{extend:{colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    /* The SR header sits above a light roster, so use the solid YA dark surface here. */
    #clc-header { background-color:#090A0F; color:#f1f5f9 }
    :root {
      --bg-cream: #FCFDFB;
      --forest-green: #3D7A47;
      --forest-dark: #2C5E34;
      --sage-light: #EEF6EE;
      --sage-border: #C5DEC8;
      --marigold: #F4BD3E;
      --marigold-soft: #FEF5DC;
      --teal-sky: #8BC3CB;
      --teal-soft: #E6F4F6;
      --coral: #E67A3C;
      --grass-green: #7EB55C;
    }

    /* Global Thin Scrollbar (6px) */
    * {
      scrollbar-width: thin;
      scrollbar-color: #9BBF9F #EEF4EE;
    }
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: #EEF4EE;
    }
    *::-webkit-scrollbar-thumb {
      background: #9BBF9F;
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: #3D7A47;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F9F5;
      color: #1E3323;
      margin: 0;
    }

    .font-brand-en {
      font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
      letter-spacing: 0.14em;
    }

    /* Compact 31px Row Height Spreadsheet Table Architecture */
    .roster-table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      width: 100%;
      min-width: 1230px;
    }

    .roster-table th {
      border: 1px solid #B8D1BA;
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
    }

    .roster-table td {
      border-left: 1px solid #DCE5DC;
      border-right: 1px solid #DCE5DC;
      border-top: none;
      border-bottom: none;
      box-sizing: border-box;
      overflow: hidden;
    }

    .roster-table tbody tr.roster-row {
      height: 31px !important;
      max-height: 31px !important;
    }

    .roster-table tbody tr.roster-row > td {
      height: 31px !important;
      max-height: 31px !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      vertical-align: middle !important;
      box-sizing: border-box !important;
    }

    /* Decouple rowspan="6" activity cell from pushing row 0 height */
    .roster-table tbody tr.roster-row > td.activity-span-cell {
      position: sticky !important;
      left: 0;
      height: 186px !important;
      max-height: 186px !important;
      padding: 0 !important;
      vertical-align: top !important;
    }
    .activity-span-inner {
      position: absolute;
      inset: 5px 8px 2px 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Fixed-height spreadsheet name cell & inner editor: never expands on focus or Shift+Enter */
    .roster-name-cell {
      height: 31px !important;
      max-height: 31px !important;
      min-height: 31px !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .roster-name-editor {
      display: block;
      width: 100%;
      height: 31px !important;
      max-height: 31px !important;
      min-height: 31px !important;
      line-height: 31px !important;
      padding: 0 2px;
      overflow: hidden !important;
      white-space: pre !important;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }
    .roster-name-editor:focus {
      background-color: #FFFFFF !important;
      box-shadow: inset 0 0 0 2px #3D7A47 !important;
    }

    /* Folder Tabs harmonized with site Forest Green & Sage palette */
    .quarter-folder-tabs {
      display: inline-flex;
      align-items: flex-end;
      padding-right: 10px;
      user-select: none;
    }
    .folder-tab-btn {
      position: relative;
      height: 31px;
      padding: 0 18px 0 14px;
      margin-right: -8px;
      border-top-left-radius: 9px;
      border-top-right-radius: 13px;
      border: 1px solid #B5D2B9;
      border-bottom: none;
      background: linear-gradient(180deg, #F5FAF5 0%, #E4F0E5 100%);
      color: #2C5E34;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
      box-shadow: 1px -1px 3px rgba(44, 94, 52, 0.07);
      clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 100%, 0 100%);
    }
    .folder-tab-btn:hover {
      background: linear-gradient(180deg, #FFFFFF 0%, #DCECDC 100%);
      transform: translateY(-1px);
    }
    .folder-tab-btn.is-active {
      height: 34px;
      z-index: 20 !important;
      transform: translateY(0);
      background: linear-gradient(180deg, #3D7A47 0%, #2C5E34 100%);
      color: #FEF5DC;
      border-color: #2C5E34;
      box-shadow: 0 -2px 6px rgba(44, 94, 52, 0.22), 2px 0 4px rgba(44, 94, 52, 0.1);
      font-weight: 900;
    }

    /* Right-click Context Menu for Folder Tabs */
    #folder-tab-context-menu {
      position: fixed;
      z-index: 9999;
      min-width: 220px;
      background: #FCFDFB;
      border: 1.5px solid #3D7A47;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(30, 51, 35, 0.22);
      padding: 6px;
      color: #1E3323;
    }
    #folder-tab-context-menu[hidden] {
      display: none !important;
    }
    #folder-tab-context-menu button {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background-color 0.1s ease;
    }
    #folder-tab-context-menu button:hover {
      background-color: #EEF6EE;
    }

    /* Crisp dark full-width week separator (extends through 當週活動 rowspan="6") */
    .roster-table tr.week-divider td,
    .roster-table td.week-divider-cell {
      border-bottom: 1.5px solid #2A4D31 !important;
    }

    /* Distinct full-width DOUBLE divider line when month changes (extends through 當週活動 rowspan="6") */
    .roster-table tr.month-divider td,
    .roster-table td.month-divider-cell {
      border-bottom: 4px double #1E3323 !important;
    }

    /* Sticky Header & Sticky First Column (follows page scroll) */
    .sticky-header-top {
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .sticky-header-sub {
      position: sticky;
      top: var(--roster-first-row, 34px);
      z-index: 30;
    }
    .sticky-col-left {
      position: sticky;
      left: 0;
      z-index: 20;
      background-color: #FCFDFB;
      box-shadow: 4px 0 10px -2px rgba(61, 122, 71, 0.12);
    }
    .sticky-corner {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 40;
      box-shadow: 4px 0 10px -2px rgba(44, 94, 52, 0.25);
    }

    /* Single-line Vertical Chinese Text for Lounge Labels */
    .vertical-zh-single {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.12em;
      white-space: nowrap;
      line-height: 1;
    }

    /* Harmonious Forest Green & Sage Selection Style (No clashing blue, no border on multi-cell range) */
    .gs-in-range {
      background-color: rgba(61, 122, 71, 0.15) !important;
      user-select: none;
    }
    .gs-selected-cell {
      position: relative;
      background-color: rgba(61, 122, 71, 0.12) !important;
      box-shadow: inset 0 0 0 2px #3D7A47 !important;
      z-index: 10;
    }
    .gs-range-corner::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      width: 6px;
      height: 6px;
      background-color: #3D7A47;
      border: 1px solid #FFFFFF;
      pointer-events: none;
      z-index: 15;
    }

    .editable-cell {
      outline: none;
      transition: background-color 0.08s ease;
    }
    .editable-cell:focus {
      background-color: #FFFFFF !important;
      box-shadow: inset 0 0 0 2px #3D7A47 !important;
    }

    @keyframes flashSage {
      0% { background-color: #FDE68A; }
      100% { background-color: transparent; }
    }
    .paste-flash {
      animation: flashSage 1.0s ease-out;
    }

    #roster-view-switch { display:none }
    /* Modern iOS HIG & Android Material 3 Mobile/Tablet Portrait Switch (< 900px or portrait tablet) */
    @media (max-width:899px), (max-width:1024px) and (orientation:portrait), (max-width:1100px) and (orientation:landscape) and (pointer:coarse) {
      #desktop-table-section {
        display: none !important;
      }
      #mobile-cards-section {
        display: block !important;
      }
      body.roster-table-view #desktop-table-section { display:block !important }
      body.roster-table-view #mobile-cards-section { display:none !important }
      #header-remark-text { display: none !important; }

      /* Compact single-row mobile tabs + sliding pill + search button */
      #roster-nav { flex-wrap: nowrap !important; gap: 4px !important; }
      .quarter-folder-tabs { padding-right: 6px !important; }
      .folder-tab-btn {
        height: 28px !important;
        padding: 0 11px 0 8px !important;
        margin-right: -6px !important;
        font-size: 12px !important;
        clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 100%, 0 100%) !important;
      }
      .folder-tab-btn.is-active {
        height: 30px !important;
      }

      /* Sliding Pill Switch (卡片 / 表格) without middle divider line */
      #roster-view-switch {
        position: relative;
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding: 2px;
        border: 1px solid #B5D2B9;
        border-radius: 9999px;
        background: #E8F2E9;
        height: 30px;
        box-sizing: border-box;
      }
      #roster-view-switch .view-switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: calc(50% - 2px);
        height: calc(100% - 4px);
        border-radius: 9999px;
        background: #2F6538;
        box-shadow: 0 1px 3px rgba(30, 51, 35, 0.22);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      body.roster-table-view #roster-view-switch .view-switch-thumb {
        transform: translateX(100%);
      }
      #roster-view-switch button {
        position: relative;
        z-index: 1;
        min-height: 24px !important;
        height: 24px !important;
        padding: 0 8px !important;
        border: 0 !important;
        background: transparent !important;
        border-radius: 9999px;
        color: #2C5E34;
        font-weight: 800;
        font-size: 12px !important;
        line-height: 1;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: color 0.18s ease;
      }
      #roster-view-switch button[aria-pressed="true"] {
        color: #FFFFFF !important;
      }

      #roster-search-toggle {
        min-height: 30px !important;
        height: 30px !important;
        padding: 0 8px !important;
        border-radius: 8px !important;
        font-size: 12px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        white-space: nowrap !important;
      }
      body.roster-table-view #roster-scroll { touch-action:pan-x pan-y }
    }
    @media (min-width:900px) {
      #desktop-table-section { display:block }
      #mobile-cards-section { display:none }
    }
    @media (orientation:landscape) and (max-height:560px) and (max-width:1100px) {
      #roster-header { padding-block:3px }
      #roster-heading { gap:4px }
      #roster-brand-line { gap:6px }
      #year-selector { font-size:22px; min-height:auto }
      #header-title-display { font-size:16px;line-height:1.2 }
      #roster-legend,#header-remark-text,#week-count-badge { display:none }
      #roster-settings-button { width:28px;height:28px }
      #roster-nav { margin-top:3px;padding-top:3px;gap:3px 7px }
      #roster-nav > div { gap:4px }
      #roster-nav button,#year-selector { min-height:27px;padding-block:0 }
      #desktop-table-section { padding-top:4px }
      #mobile-cards-section { padding-top:5px }
    }
    /* Desktop activity notes share one right-hand column for + and ×. */
    .desktop-event-stack { position:relative; top:var(--desktop-event-offset, 0px); padding-bottom:7px; }
    .desktop-event-row {
      display:grid;
      grid-template-columns:6px minmax(0,1fr) 16px;
      gap:3px;
      align-items:center;
      min-height:17px;
    }
    .desktop-event-text { min-width:0; overflow-wrap:anywhere; }
    .desktop-event-stack .desktop-event-action {
      width:16px;
      height:16px;
      margin:0;
      padding:0;
      text-align:center;
      line-height:16px;
    }
    .desktop-event-stack .desktop-event-add { position:absolute; right:0; top:-16px; }
    .desktop-event-row:focus-within .desktop-event-action { opacity:1; }
    #desktop-table-section { box-sizing:border-box;padding:8px 12px 12px }
    @media (min-width:640px) { #desktop-table-section { padding-inline:20px } }
    #roster-scroll {
      max-height:max(180px, calc(100dvh - var(--roster-top, 150px) - 12px));
      overflow:auto;border:1px solid #c5dec8;border-radius:9px;
      scrollbar-width:thin;scrollbar-color:#83a98a #edf4eb;
    }
    @media (hover:hover) and (pointer:fine) {
      #roster-scroll:not(:hover):not(:focus-visible) { scrollbar-color:transparent transparent !important }
      #roster-scroll:hover,#roster-scroll:focus-visible { scrollbar-color:#83a98a transparent !important }
      #roster-scroll::-webkit-scrollbar { height:6px !important;width:6px !important }
      #roster-scroll::-webkit-scrollbar-thumb { background:transparent !important }
      #roster-scroll:hover::-webkit-scrollbar-thumb,#roster-scroll:focus-visible::-webkit-scrollbar-thumb {
        background:#83a98a !important;
      }
    }
    #roster-scroll:focus-visible { outline:2px solid #3d7a47;outline-offset:2px }
    .roster-table th,.roster-table td { border-left:0 }
    .roster-announcement { background:#f8edda;color:#603d21;font-weight:750 }
    .roster-announcement td { padding:7px 9px;line-height:1.35 }
    .roster-announcement .sticky-col-left { background:inherit }
    .roster-announcement.pause,.roster-announcement.pause .sticky-col-left { background:#fae5e4;color:#8a2626 }
    .roster-announcement.outing,.roster-announcement.outing .sticky-col-left { background:#e5f3e4;color:#285534 }
    .roster-announcement.special,.roster-announcement.special .sticky-col-left { background:#fbefd4 }
    .mobile-announcement { padding:12px 14px;border-radius:10px;font-size:18px }
    .roster-manager-panel { max-height:90dvh;overflow:auto;scrollbar-width:thin }
    #roster-settings-button[hidden],#roster-tbody button[hidden] { display:none!important }
    .roster-settings-block { padding:8px 0;border-top:1px solid #c5dec8 }
    .roster-settings-block summary { color:#2c5e34;font-weight:800;cursor:pointer }
    .roster-settings-block form { margin-top:8px }
    .roster-settings-block form[hidden] { display:none }
    .roster-settings-block label,#roster-search-form label { display:grid;gap:4px;font-weight:700;margin-bottom:8px }
    .roster-settings-block input,.roster-settings-block select,#roster-search-form input,#roster-search-form select {
      width:100%;min-width:0;min-height:42px;box-sizing:border-box;border:1px solid #a2bea6;
      border-radius:8px;background:#fff;color:#203a25;padding:6px 9px;color-scheme:light;
    }
    .roster-settings-block button,#roster-search button,.roster-search-button {
      border:1px solid #9bbd9f;border-radius:8px;background:#eaf4e9;color:#234d2c;
      padding:5px 10px;min-height:38px;font-weight:750;
    }
    #roster-calendar-list li { display:flex;gap:5px;margin-top:5px }
    #roster-calendar-list button:first-child { flex:1;text-align:left }
    #roster-calendar-error { color:#962c23 }
    .roster-settings-note { margin-top:6px;color:#526950 }
    #roster-search {
      margin:6px 12px 2px;border:1px solid #a9c7ad;border-radius:12px;
      background:#fcfdfb;color:#1e3323;padding:10px 14px;font-size:15px;
    }
    #roster-search[hidden] { display:none !important }
    #roster-search-toggle::after { content:" ▾" }
    #roster-search-toggle[aria-expanded="true"]::after { content:" ▴" }
    @media(min-width:640px) { #roster-search { margin-inline:20px } }
    .roster-search-compact-form { display:grid;gap:8px; }
    .roster-search-row-top { display:flex;flex-wrap:wrap;align-items:center;gap:8px; }
    .roster-search-row-months { display:flex;flex-wrap:wrap;align-items:center;gap:8px; }
    #roster-search-form input,#roster-search-form select {
      min-height:34px !important;height:34px !important;padding:2px 8px !important;font-size:14px !important;
    }
    .roster-search-month-pills {
      display:flex;flex-wrap:wrap;align-items:center;gap:4px;
    }
    .roster-search-month-pills button {
      min-height:32px !important;height:32px !important;padding:0 9px !important;
      border:1px solid #b5d2b9 !important;border-radius:8px !important;
      background:#f4f8f4 !important;color:#2c5e34 !important;font-size:13px !important;font-weight:750 !important;
      transition:all 0.1s ease;
    }
    .roster-search-month-pills button[aria-pressed="true"] {
      background:#3d7a47 !important;color:#ffffff !important;border-color:#2c5e34 !important;
    }
    #roster-name-suggestions:empty { display:none }
    #roster-name-suggestions { display:flex;flex-wrap:wrap;gap:4px;margin:0 }
    #roster-name-suggestions button { display:inline-flex;align-items:center;gap:5px;min-height:30px !important;padding:2px 8px !important;font-size:13px !important }
    #roster-name-suggestions small { color:#375e40;font-size:11px }
    #roster-name-suggestions [aria-selected="true"] { background:#d0e8d3;outline:2px solid #3d7a47 }
    .roster-voice-field { display:flex;align-items:center;gap:4px }
    .roster-voice-field input { flex:1 }
    #roster-voice-button { min-width:34px !important;min-height:34px !important;height:34px !important;padding:0 8px !important;display:grid;place-items:center }
    #roster-voice-button[hidden],#roster-voice-status:empty { display:none }
    #roster-voice-button[aria-pressed="true"] { background:#fce8e6;color:#a33236;border-color:#c37e7f }
    #roster-voice-status { color:#45624a;font-size:13px;margin:0 }
    #roster-search-results { margin-top:8px;max-height:220px;overflow:auto }
    #roster-search-results:empty { display:none }
    #roster-search-results section { margin-top:6px;padding:6px 0;border-top:1px solid #d4e4d6;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px }
    #roster-search-results h3 { font-weight:850;margin-bottom:4px }
    #roster-search-results h4 { font-weight:850;color:#2c5e34;min-width:68px }
    #roster-search-results ul { display:flex;flex-wrap:wrap;gap:6px 12px }
    .roster-search-choices { display:flex;flex-wrap:wrap;gap:7px;margin-top:8px }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ===================================================================== -->
  <!-- TOP HEADER & QUARTER / MONTH NAVIGATION BAR                           -->
  <!-- ===================================================================== -->
  <header id="clc-header"></header>
  <header id="roster-header" class="bg-[#FCFDFB] border-b border-[#C5DEC8] px-3 sm:px-5 py-2.5">
    <div id="roster-heading" class="max-w-full mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Left: Big Year Dropdown (borderless, small downward arrow at bottom-right) + Title + Version Status Badge -->
      <div id="roster-brand-line" class="flex items-baseline gap-2 flex-wrap">
        <div class="relative inline-flex items-baseline">
          <select id="year-selector" onchange="switchYear(this.value)" aria-label="選擇年份" title="點擊切換年份"
            class="appearance-none bg-transparent border-0 p-0 pr-4 text-3xl sm:text-4xl font-black text-[#3D7A47] hover:text-[#2C5E34] tracking-tight leading-none cursor-pointer focus:outline-none">
            <option value="2026" class="text-sm font-bold bg-[#FCFDFB] text-[#1E3323]">2026</option>
            <option value="2027" class="text-sm font-bold bg-[#FCFDFB] text-[#1E3323]">2027</option>
          </select>
          <svg class="w-3.5 h-3.5 text-[#3D7A47] absolute right-0 bottom-0.5 pointer-events-none" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />

            weeks.push(createBlankWeek(`${year}-${qDef.q.toLowerCase()}-w${wIdx++}`, month, `${month}月${day}日`, weekOfMonth++));
          }
        }
      }
      return {
        year: String(year),
        title: qDef.title,
        months: qDef.months.slice(),
        weeks
      };

    function initFirebaseAdminWatcher() {
      try {
        if (!window.firebase || !firebase.apps || !firebase.apps.length || !firebase.auth) return true;
        firebase.auth().onAuthStateChanged(async (user) => {
          if (!user) {
            firebaseClaimAdmin = false;
            syncAdminUiState();
            return;
          }
          try {
            const tokenRes = await user.getIdTokenResult();
            const claims = tokenRes?.claims || {};
            if (claims.superuser === true || claims.admin === true || claims.role === 'admin' || claims.role === 'superuser') {
              firebaseClaimAdmin = true;
              syncAdminUiState();
              return;
            }
            const db = getFirestoreDb();
            if (db) {
              for (const col of ['admins', 'superusers', 'users']) {
                const snap = await db.collection(col).doc(user.uid).get();
                if (snap.exists) {
                  const d = snap.data() || {};
                  if (col !== 'users' || d.isSuperuser === true || d.isAdmin === true || d.role === 'admin' || d.role === 'superuser') {
                    firebaseClaimAdmin = true;
                    syncAdminUiState();
                    return;
                  }
                }
              }
            }
          } catch (_) {}
          syncAdminUiState();
        });
        return true;
      } catch (_) {
        return false;
      }

    function syncQuarterToFirebase(qKey) {
      const db = getFirestoreDb();
      if (!db) return false;
      clearTimeout(firebaseSyncTimer);
      showRosterDraftStatus('☁️ 正在儲存至 Firebase...');
      firebaseSyncTimer = setTimeout(async () => {
        try {
          const targetQ = ensureQuarterExists(qKey);
          const payload = {
            year: targetQ.year,
            title: targetQ.title,
            months: targetQ.months,
            weeks: JSON.parse(JSON.stringify(targetQ.weeks)),
            calendar: JSON.parse(JSON.stringify(calendar())),
            versionStatus: versionStatus,
            updatedAt: firebase.firestore.FieldValue ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
          };
          await db.collection(FIREBASE_COLLECTION).doc(qKey).set(payload, { merge: true });
          showRosterDraftStatus('☁️ 已同步儲存至 Firebase');
        } catch (err) {
          console.error('Firebase save error:', err);
          showRosterDraftStatus('⚠️ Firebase 同步失敗，已暫存於本機瀏覽器');
        }

    function subscribeQuarterFromFirebase(qKey) {
      if (firebaseUnsubscribe) {
        firebaseUnsubscribe();
        firebaseUnsubscribe = null;

      const db = getFirestoreDb();
      if (!db) {
        showRosterDraftStatus();
        return;
      }
      showRosterDraftStatus('☁️ 正在載入 Firebase 資料...');
      firebaseUnsubscribe = db.collection(FIREBASE_COLLECTION).doc(qKey).onSnapshot(
        (doc) => {
          if (!doc.exists) {
            showRosterDraftStatus('☁️ Firebase 已連線（雲端尚無修改紀錄）');
            return;
          }
          const data = doc.data();
          if (data && Array.isArray(data.weeks) && data.weeks.length > 0) {
            // Avoid overwriting cell currently being typed into
            const activeEl = document.activeElement;
            const isEditing = activeEl && (activeEl.isContentEditable || activeEl.tagName === 'INPUT');
            isApplyingRemoteSnapshot = true;
            ensureQuarterExists(qKey).weeks = data.weeks;
            if (Array.isArray(data.calendar)) {
              ensureQuarterExists(qKey).calendar = data.calendar;
              localRosterSettings[qKey] = { ...(localRosterSettings[qKey] || {}), calendar: data.calendar };
            }
            if (typeof data.versionStatus === 'string' && (data.versionStatus === '確認版' || data.versionStatus === '初稿')) {

            if (qKey === DRAFT_QUARTER) {

        }

    const searchPanel = document.getElementById('roster-search');

    Object.entries(SEARCH_ROLES).forEach(([value,text]) => searchRoles.add(new Option(text,value)));
    const nameSoundCache = new Map();
    const SEARCH_VARIANTS = { 臺:'台',裏:'裡',峯:'峰',綫:'線',爲:'為' };
    const MATCH_LABELS = ['完全符合','開頭符合','文字包含','同音','近音','相關字'];
    let activeSuggestion = -1;
    let selectedSearchName = '';

    function nameKey(value) {
      return value.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')
        .replace(/[臺裏峯綫爲]/g,char => SEARCH_VARIANTS[char]);
    }
    function nameSounds(value) {
      if (!window.pinyinPro) return [];
      if (nameSoundCache.has(value)) return nameSoundCache.get(value);
      const sounds = window.pinyinPro.pinyin(value,{toneType:'none',type:'array',nonZh:'consecutive'});
      nameSoundCache.set(value,sounds);
      return sounds;
    }
    function nearSound(value) {
      return value.replace(/^([zcs])h/,'$1').replace(/^l/,'n').replace(/^fu/,'hu')
        .replace(/ing$/,'in').replace(/eng$/,'en');
    }
    function syllableContains(query, name) {
      return query.length >= 2 && name.some((_,index) => query.every((syllable,offset) => name[index+offset] === syllable));
    }
    function differsOnce(a,b) {
      if (Math.abs(a.length-b.length) > 1) return false;
      if (a.length > b.length) return differsOnce(b,a);
      let i = 0;
      while (i < a.length && a[i] === b[i]) i++;
      return a.slice(i+(a.length === b.length ? 1 : 0)).join('') === b.slice(i+1).join('');
    }
    function nameScore(term, name) {
      const query = nameKey(term), known = nameKey(name);
      if (!query) return Infinity;
      if (known === query) return 0;
      if (known.startsWith(query)) return 1;
      if (known.includes(query)) return 2;
      if (query.length < 2) return Infinity;
      const left = nameSounds(query), right = nameSounds(known);
      if (syllableContains(left,right)) return 3;
      if (syllableContains(left.map(nearSound),right.map(nearSound))) return 4;
      const queryChars = [...new Set(query)];
      const shared = queryChars.filter(char => known.includes(char)).length;
      if ((query.length >= 3 && differsOnce([...query],[...known])) ||
          (queryChars.length >= 2 && known.length >= 3 && shared >= 2 && shared/queryChars.length >= 2/3)) return 5;
      return Infinity;
    }

    function renderSearchMonthPills() {
      if (!searchMonthsContainer) return;
      searchMonthsContainer.replaceChildren();
      for (let m = 1; m <= 12; m++) {
        const btn = document.createElement('button');
        btn.type = 'button';

        btn.onclick = () => {
          if (selectedSearchMonths.has(m)) {
            selectedSearchMonths.delete(m);
          } else {
            selectedSearchMonths.add(m);
          }
          btn.setAttribute('aria-pressed', String(selectedSearchMonths.has(m)));
          runRosterSearch();
          resizeRosterViewport();

        searchMonthsContainer.append(btn);

    }

    function quarterOverrideFor(qObj, week) {
      const qKey = `${qObj.year}-Q${Math.ceil(week.month / 3)}`;
      const cal = localRosterSettings[qKey]?.calendar ?? qObj.calendar ?? (
        qKey === '2027-Q1' ? [{date:'2027-02-04',type:'pause',label:'農曆春節休會'}] : []
      );
      const match = /^(\d{1,2})月\s*(\d{1,2})日$/.exec(week.date.trim());
      const iso = match ? qObj.year+'-'+match[1].padStart(2,'0')+'-'+match[2].padStart(2,'0') : '';
      return cal.find(entry => entry.date === iso && entry.type !== 'special');
    }

    function assignments(targetYear = quarter().year) {
      const yearQuarters = ['Q1', 'Q2', 'Q3', 'Q4'].map(qCode => ensureQuarterExists(`${targetYear}-${qCode}`));
      return yearQuarters.flatMap(qObj => qObj.weeks.flatMap(week => {
        const match = /^(\d{1,2})月\s*(\d{1,2})日$/.exec(week.date.trim());
        const date = match ? qObj.year+'-'+match[1].padStart(2,'0')+'-'+match[2].padStart(2,'0') : '';
        if (!date || quarterOverrideFor(qObj, week)) return [];
        const rows = Object.keys(SEARCH_ROLES).filter(role => role !== 'speaker').flatMap(role => (week[role] || []).flatMap(value => {
          const name = value.trim();
          return !name || /^[（(]/.test(name) || ['讚美操','健康操'].includes(name) ? [] : [{date,month:week.month,role,name}];
        }));
        const speaker = week.speaker.trim();
        const name = speaker.replace(/\s*(牧師|師母|傳道|弟兄|姊妹|姐妹|長老|執事|老師)\s*$/,'').trim();
        if (name && week.speakerType !== 'outing' && !/(佈道|活動|休會|出遊)$/.test(name)) {
          rows.push({date,month:week.month,role:'speaker',name,displayName:speaker});
        }
        return rows;
      }));
    }
    function renderSearch(name, entries) {
      searchResults.replaceChildren();
      if (!entries.length) {
        searchResults.textContent = '這個範圍內沒有符合的服事。';
        return;
      }
      if (name) {
        const heading = document.createElement('h3');
        heading.textContent = name+'的服事';
        searchResults.append(heading);
      }
      const groups = new Map();
      for (const entry of entries) {
        if (!groups.has(entry.date)) groups.set(entry.date,new Map());
        const roles = groups.get(entry.date);
        if (!roles.has(entry.role)) roles.set(entry.role,new Set());
        roles.get(entry.role).add(entry.displayName || entry.name);
      }
      for (const [date,roles] of [...groups].sort(([a],[b]) => a.localeCompare(b))) {
        const section = document.createElement('section');
        const headline = document.createElement('h4');
        headline.textContent = displayDate(date);
        const list = document.createElement('ul');
        for (const [role,names] of roles) {
          const li = document.createElement('li');
          li.textContent = SEARCH_ROLES[role]+(name && role !== 'speaker' ? '' : '　'+[...names].join('、'));
          list.append(li);
        }
        section.append(headline,list);
        searchResults.append(section);
      }
    }

    function candidatesFor(term, targetYear) {
      const names = new Map();
      for (const {name,displayName} of assignments(targetYear)) {
        if (!names.has(name)) names.set(name,new Set([name]));
        if (displayName) names.get(name).add(displayName);
      }
      return [...names].map(([name,aliases]) => ({
        name,score:Math.min(...[...aliases].map(alias => nameScore(term,alias)))
      })).filter(item => Number.isFinite(item.score))
        .sort((a,b) => a.score-b.score || a.name.localeCompare(b.name,'zh-Hant'));
    }
    function clearSuggestions() {
      activeSuggestion = -1;
      suggestions.replaceChildren();
      searchName.setAttribute('aria-expanded','false');
      searchName.removeAttribute('aria-activedescendant');
    }
    function renderSuggestions(choices) {
      clearSuggestions();
      for (const [index,{name,score}] of choices.slice(0,8).entries()) {
        const button = document.createElement('button');
        const reason = document.createElement('small');
        button.type = 'button';
        button.tabIndex = -1;
        button.id = 'roster-name-option-'+index;
        button.setAttribute('role','option');
        button.setAttribute('aria-selected','false');
        reason.textContent = MATCH_LABELS[score];
        button.append(name,reason);
        button.onclick = () => {
          selectedSearchName = name;
          searchName.value = name;
          clearSuggestions();
          runRosterSearch();
          searchName.focus({preventScroll:true});
        };
        suggestions.append(button);
      }
      searchName.setAttribute('aria-expanded',String(choices.length > 0));
    }
    function runRosterSearch(showSuggestions = false) {
      const term = searchName.value.trim();
      const role = searchRoles.value;
      const targetYear = searchForm.elements.year ? searchForm.elements.year.value : quarter().year;
      if (selectedSearchMonths.size === 0) {
        searchResults.textContent = '請至少點選一個月份。';
        return;
      }
      const data = assignments(targetYear).filter(item => (!role || item.role === role) &&
        selectedSearchMonths.has(item.month));
      if (!term) { clearSuggestions(); renderSearch('',data); return; }
      const choices = candidatesFor(term, targetYear);
      const exact = choices.filter(choice => choice.score === 0);
      const picked = selectedSearchName === term ? term : exact.length === 1 ? exact[0].name : choices.length === 1 ? choices[0].name : '';
      if (picked) {
        if (showSuggestions) renderSuggestions(choices);
        else clearSuggestions();
        renderSearch(picked,data.filter(item => item.name === picked));
      } else if (!choices.length) {
        clearSuggestions();
        renderSearch('',[]);
      } else {
        renderSuggestions(choices);
        const names = new Set(choices.slice(0,8).map(choice => choice.name));
        renderSearch('',data.filter(item => names.has(item.name)));
        const instruction = document.createElement('p');
        instruction.textContent = '以下是可能符合的服事。點上方姓名可縮小範圍。';
        searchResults.prepend(instruction);
      }
    }
    function resetRosterSearch() {
      cancelRosterVoice();
      clearSuggestions();
      searchResults.replaceChildren();
      searchForm.reset();
      selectedSearchName = '';
      if (searchForm.elements.year) {
        searchForm.elements.year.value = quarter().year;
      }
      selectedSearchMonths = new Set(quarter().months);
      renderSearchMonthPills();
    }
    function setRosterSearchOpen(open) {
      if (!open) cancelRosterVoice();
      searchPanel.hidden = !open;
      document.getElementById('roster-search-toggle').setAttribute('aria-expanded',String(open));
      resizeRosterViewport();
    }
    function openRosterSearch() { setRosterSearchOpen(searchPanel.hidden); }
    function refreshSuggestions(event) {
      if (event.isComposing) return;
      selectedSearchName = '';
      runRosterSearch(true);
      resizeRosterViewport();
    }
    searchName.addEventListener('input',refreshSuggestions);
    searchName.addEventListener('compositionend',refreshSuggestions);
    searchName.addEventListener('keydown',event => {
      if (event.isComposing || !suggestions.children.length) return;
      const count = suggestions.children.length;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const step = event.key === 'ArrowDown' ? 1 : -1;
        activeSuggestion = activeSuggestion < 0 && step < 0 ? count-1 : (activeSuggestion+step+count)%count;
        [...suggestions.children].forEach((button,index) => button.setAttribute('aria-selected',String(index === activeSuggestion)));
        searchName.setAttribute('aria-activedescendant',suggestions.children[activeSuggestion].id);
      } else if (event.key === 'Escape') {
        clearSuggestions();
      } else if (event.key === 'Enter' && activeSuggestion >= 0) {
        event.preventDefault();
        suggestions.children[activeSuggestion].click();
      }
    });
    searchForm.addEventListener('change', event => {
      if (event.target === searchName) return;
      runRosterSearch();
      resizeRosterViewport();
    });
    searchForm.addEventListener('submit',event => { event.preventDefault(); runRosterSearch(); resizeRosterViewport(); });
    const voiceButton = document.getElementById('roster-voice-button');
    const voiceStatus = document.getElementById('roster-voice-status');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rosterVoice;

    function rosterVoiceState(active, message = '') {
      voiceButton.setAttribute('aria-pressed',String(active));
      voiceButton.setAttribute('aria-label',active ? '停止語音輸入' : '語音輸入姓名');
      voiceButton.title = active ? '停止語音輸入' : '語音輸入姓名';
      voiceStatus.textContent = message;
    }
    function cancelRosterVoice() {
      if (!rosterVoice) return;
      const active = rosterVoice;
      rosterVoice = null;
      active.abort();
      rosterVoiceState(false);
    }
    if (SpeechRecognition) {
      voiceButton.hidden = false;
      voiceButton.addEventListener('click',() => {
        if (rosterVoice) { rosterVoice.stop(); return; }
        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'zh-TW';
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;
          recognition.onresult = event => {
            if (rosterVoice !== recognition) return;
            const text = Array.from(event.results,result => result[0].transcript).join('')
              .replace(/[。，,.！!？?\s]+$/u,'').trim();
            if (!text) return;
            searchName.value = text;
            searchName.dispatchEvent(new Event('input',{bubbles:true}));
          };
          recognition.onerror = event => {
            if (rosterVoice !== recognition) return;
            rosterVoice = null;
            const message = ['not-allowed','service-not-allowed'].includes(event.error)
              ? '請允許瀏覽器使用麥克風，或直接輸入姓名。'
              : event.error === 'no-speech' ? '沒有聽到聲音，請再按一次麥克風。'
              : '語音輸入暫時無法使用，請直接輸入姓名。';
            rosterVoiceState(false,message);
          };
          recognition.onend = () => {
            if (rosterVoice !== recognition) return;
            rosterVoice = null;
            rosterVoiceState(false);
          };
          rosterVoice = recognition;
          recognition.start();
          rosterVoiceState(true,'聆聽中，請說出姓名。');
        } catch (_) {
          rosterVoice = null;
          rosterVoiceState(false,'語音輸入暫時無法使用，請直接輸入姓名。');
        }
      });
    }

    // =========================================================================
    // 2. YEAR, FOLDER QUARTER TABS & MONTH NAVIGATION LOGIC
    // =========================================================================
    function getQuarterUrlInfo(qKey) {
      const url = new URL(window.location.href);
      // Remove all existing query params and hash to produce the shortest possible URL (?q=2026-Q4)
      const shortPath = `${url.pathname}?q=${qKey}`;
      const shortFullUrl = `${url.origin}${shortPath}`;
      return {
        fullUrl: shortFullUrl,
        shortcutPath: shortPath
      };
    }

    function updateUrlQuarterParam(qKey) {
      try {
        window.history.replaceState(null, '', `?q=${qKey}`);
      } catch (_) {}
    }

    function switchYear(yearVal) {
      const qCode = currentQuarterKey.split('-')[1] || 'Q1';
      switchQuarter(`${yearVal}-${qCode}`);
    }

    function switchQuarter(qKey, syncUrl = true) {
      ensureQuarterExists(qKey);
      currentQuarterKey = qKey;
      const yearPart = qKey.split('-')[0];
      const yearSel = document.getElementById('year-selector');
      if (yearSel) yearSel.value = yearPart;
      if (syncUrl) updateUrlQuarterParam(qKey);

      showRosterDraftStatus();
      subscribeQuarterFromFirebase(qKey);
      renderRosterSettings();
      resetRosterSearch();
      selectedMonthFilter = 'ALL';
      selectionRange = { startR: 0, startC: 0, endR: 0, endC: 0 };
      updateQuarterHeaderAndTabs();
      renderDesktopTable();
      renderMobileCards();
      const q = quarterStore[qKey];
      showToast(`已切換至 ${q.year} 年 ${q.title}`);
    }

    function renderQuarterFolderTabs() {
      const container = document.getElementById('quarter-folder-tabs');
      if (!container) return;
      const yearPart = currentQuarterKey.split('-')[0];
      container.innerHTML = '';

      QUARTER_DEFS.forEach(qDef => {
        const qKey = `${yearPart}-${qDef.q}`;
        const isActive = currentQuarterKey === qKey;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.role = 'tab';
        btn.setAttribute('aria-selected', String(isActive));
        btn.className = `folder-tab-btn${isActive ? ' is-active' : ''}`;
        btn.title = `${yearPart} ${qDef.q} — 點擊切換，按右鍵可複製短網址與捷徑`;
        btn.textContent = qDef.q;

        btn.onclick = () => {
          closeFolderTabContextMenu();
          if (currentQuarterKey !== qKey) {
            switchQuarter(qKey);
          }
        };

        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openFolderTabContextMenu(e.clientX, e.clientY, qKey, `${yearPart} ${qDef.q}`);
        });

        container.appendChild(btn);
      });
    }

    const folderMenu = document.getElementById('folder-tab-context-menu');
    let contextMenuTargetQKey = '';

    function openFolderTabContextMenu(x, y, qKey, labelText) {
      contextMenuTargetQKey = qKey;
      const { fullUrl, shortcutPath } = getQuarterUrlInfo(qKey);
      document.getElementById('folder-tab-menu-header').textContent = labelText;
      document.getElementById('ctx-full-url-preview').textContent = fullUrl;
      document.getElementById('ctx-shortcut-preview').textContent = shortcutPath;

      folderMenu.hidden = false;
      const rect = folderMenu.getBoundingClientRect();
      const left = Math.min(x, window.innerWidth - rect.width - 10);
      const top = Math.min(y, window.innerHeight - rect.height - 10);
      folderMenu.style.left = `${Math.max(8, left)}px`;
      folderMenu.style.top = `${Math.max(8, top)}px`;
    }

    function closeFolderTabContextMenu() {
      if (folderMenu) folderMenu.hidden = true;
    }

    function copyToClipboardWithFeedback(text, message) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => {
          copyTextFallback(text);
          showToast(message);
        });
      } else {
        copyTextFallback(text);
        showToast(message);
      }
    }

    document.getElementById('ctx-copy-full-url').addEventListener('click', () => {
      if (!contextMenuTargetQKey) return;
      const { fullUrl } = getQuarterUrlInfo(contextMenuTargetQKey);
      copyToClipboardWithFeedback(fullUrl, `已複製短網址：${fullUrl}`);
      closeFolderTabContextMenu();
    });

    document.getElementById('ctx-copy-shortcut-path').addEventListener('click', () => {
      if (!contextMenuTargetQKey) return;
      const { shortcutPath } = getQuarterUrlInfo(contextMenuTargetQKey);
      copyToClipboardWithFeedback(shortcutPath, `已複製捷徑路徑：${shortcutPath}`);
      closeFolderTabContextMenu();
    });

    document.addEventListener('click', (e) => {
      if (folderMenu && !folderMenu.hidden && !folderMenu.contains(e.target)) {
        closeFolderTabContextMenu();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFolderTabContextMenu();
    });

    function setMonthFilter(monthVal) {
      selectedMonthFilter = monthVal;
      selectionRange = { startR: 0, startC: 0, endR: 0, endC: 0 };
      updateQuarterHeaderAndTabs();
      renderDesktopTable();
      renderMobileCards();
    }

    function getActiveWeeks() {
      const q = quarter();
      return q.weeks
        .map((week, realIdx) => ({ week, realIdx }))
        .filter(item => selectedMonthFilter === 'ALL' || item.week.month === Number(selectedMonthFilter));
    }

    function updateQuarterHeaderAndTabs() {
      const q = quarter();
      const yearSelEl = document.getElementById('year-selector');
      if (yearSelEl) yearSelEl.value = q.year;
      document.getElementById('header-title-display').textContent = q.title;
      document.title = `${q.year} ${q.title}`;
      renderQuarterFolderTabs();

      const activeWeeks = rosterSchedule().filter(item => !item.announcement);
      document.getElementById('week-count-badge').textContent = `共 ${activeWeeks.length} 週聚會`;
    }

    // =========================================================================
    // 3. RENDER COMPACT DESKTOP SPREADSHEET TABLE
    // =========================================================================
    let desktopEventObserver;

    function alignDesktopEvents(weeks) {
      for (const {activityCell, lastSongCell} of weeks) {
        if (!lastSongCell.getClientRects().length) continue;
        const stack = activityCell.querySelector('.desktop-event-stack');
        const anchor = stack.querySelector('.desktop-event-row:last-child') ||
          stack.querySelector('.desktop-event-add');
        const song = lastSongCell.getBoundingClientRect();
        const note = anchor.getBoundingClientRect();
        const previous = parseFloat(stack.style.getPropertyValue('--desktop-event-offset')) || 0;
        const offset = previous + (song.top + song.height/2) - (note.top + note.height/2);
        if (Math.abs(offset-previous) > 0.25) {
          stack.style.setProperty('--desktop-event-offset', offset+'px');
        }
      }
    }

    function renderDesktopTable() {
      const tbody = document.getElementById('roster-tbody');
      desktopEventObserver?.disconnect();
      tbody.innerHTML = '';
      const weekCells = [];

      const visibleItems = rosterSchedule();
      let gridWeekIndex = 0;
      visibleItems.forEach((item, index) => {
        const nextItem = visibleItems[index + 1];
        const isMonthEnd = nextItem && nextItem.month !== item.month;
        if (item.announcement) {
          tbody.append(renderDesktopAnnouncement(item,isMonthEnd));
          return;
        }
        const {week,realIdx} = item;
        const displayIdx = gridWeekIndex++;
        const spStyle = SPEAKER_STYLES[week.speakerType] || SPEAKER_STYLES.church;
        const hasSpeaker = Boolean((week.speaker || '').trim());
        let activityCell;

        for (let r = 0; r < 6; r++) {
          const tr = document.createElement('tr');
          let rowClasses = ['roster-row'];
          if (r === 5) {
            rowClasses.push(isMonthEnd ? 'month-divider' : 'week-divider');
          }
          tr.className = rowClasses.join(' ');

          // -----------------------------------------------------------------
          // COLUMN 1: 當週活動 (Row 0 spans all 6 rows: rowspan="6")
          // Bottom-aligned special events stack upward when '+' is clicked
          // -----------------------------------------------------------------
          if (r === 0) {
            const tdActivity = document.createElement('td');
            activityCell = tdActivity;
            tdActivity.rowSpan = 6;
            const dividerCellClass = isMonthEnd ? 'month-divider-cell' : 'week-divider-cell';
            tdActivity.className = `sticky-col-left activity-span-cell ${dividerCellClass} leading-normal`;

            const eventsList = Array.isArray(week.events) ? week.events : [];
            const eventsHtml = eventsList.map((ev, evIdx) => {
              const colorCfg = EVENT_COLORS[ev.color] || EVENT_COLORS.red;
              return `
                <div class="group/ev desktop-event-row leading-tight">
                  <button type="button" ${canManageRoster() ? '' : 'disabled'} onclick="cycleEventColor(${realIdx}, ${evIdx})"
                    title="點擊切換文字顏色（${colorCfg.label}）"
                    class="w-1.5 h-1.5 rounded-full ${colorCfg.dot} shrink-0 opacity-75 hover:opacity-100 hover:scale-125 transition-all"></button>
                  <div contenteditable="${canManageRoster()}"
                    data-placeholder="輸入活動..."
                    onblur="updateEventItem(${realIdx}, ${evIdx}, this.innerText)"
                    class="editable-cell desktop-event-text text-[12px] ${colorCfg.cls} px-0.5 py-0 rounded leading-tight min-h-[15px]">${escapeHtml(ev.text)}</div>
                  <button type="button" ${canManageRoster() ? '' : 'hidden'} onclick="removeEventItem(${realIdx}, ${evIdx})"
                    title="刪除此列"
                    class="desktop-event-action opacity-0 group-hover/ev:opacity-100 text-[11px] font-bold text-[#6C8570] hover:text-[#C53030] transition-opacity">×</button>
                </div>
              `;
            }).join('');

            tdActivity.innerHTML = `
              <div class="activity-span-inner">
                <!-- Top Stacked Block: Line 1 Date -> Line 2 Speaker -> Line 3 Topic -->
                <div class="space-y-1">
                  <!-- Line 1: Month & Day + Top-Right Admin Action Down Arrow -->
                  <div class="flex items-center justify-between gap-1">
                    <span contenteditable="${canManageRoster()}"
                      onblur="updateActivityField(${realIdx}, 'date', this.innerText)"
                      class="editable-cell inline-block text-[16px] font-black text-[#2C5E34] px-1 rounded leading-tight">${escapeHtml(week.date)}</span>
                    <button type="button" ${canManageRoster() ? '' : 'hidden'}
                      onclick="openActivityActionMenu(event, ${realIdx})"
                      title="當週活動操作（休會 / 特殊活動 / 向下新增 / 向上新增）"
                      class="w-5 h-5 rounded-md bg-[#EEF6EE] hover:bg-[#3D7A47] text-[#2C5E34] hover:text-white border border-[#C5DEC8] flex items-center justify-center transition-colors shrink-0">
                      <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                      </svg>
                    </button>
                  </div>

                  <!-- Line 2: Speaker -->
                  <div>
                    <div class="inline-flex items-center max-w-full rounded-lg border-2 px-1.5 py-0 shadow-2xs ${spStyle.cls}">
                      <span contenteditable="${canManageRoster()}"
                        data-placeholder="輸入講員..."
                        onblur="updateActivityField(${realIdx}, 'speaker', this.innerText)"
                        class="editable-cell text-[16px] font-extrabold tracking-wide px-0.5 rounded leading-tight min-w-[74px] ${
                          hasSpeaker ? '' : 'text-[#5C7260]/60'
                        }">${hasSpeaker ? escapeHtml(week.speaker) : '輸入講員'}</span>
                      <button type="button" ${canManageRoster() ? '' : 'hidden'} onclick="cycleSpeakerType(${realIdx})"
                        title="切換講員分類底色（${spStyle.label}）"
                        class="ml-1 w-4 h-4 rounded-full bg-white/85 hover:bg-white border border-[#3D7A47]/40 flex items-center justify-center text-[10px] font-black text-[#2C5E34] shrink-0">
                        ↻
                      </button>
                    </div>
                  </div>

                  <!-- Line 3: Topic -->
                  <div contenteditable="${canManageRoster()}"
                    onblur="updateActivityField(${realIdx}, 'topic', this.innerText)"
                    class="editable-cell text-[13px] font-bold text-[#2B5D82] leading-snug px-1 rounded min-h-[18px]">${escapeHtml(week.topic)}</div>
                </div>

                <!-- Bottom-Aligned Special Events (Flush with bottom border; '+' stacks upward) -->
                <div class="desktop-event-stack">
                  <div class="space-y-0.5">
                    ${eventsHtml}
                  </div>
                  <button type="button" ${canManageRoster() ? '' : 'hidden'} onclick="addEventItemUpward(${realIdx})"
                    title="新增特別事件（從最底下往上疊加）"
                    class="desktop-event-action desktop-event-add text-[#3D7A47] hover:text-[#1E3323] text-xs font-black transition-colors">
                    +
                  </button>
                </div>
              </div>
            `;
            tr.appendChild(tdActivity);
          }

          const globalRow = displayIdx * 6 + r;

          // -----------------------------------------------------------------
          // COLUMNS 2-5: 敬拜(0), 樂手(1), 投影片(2), 音控(3) + 條列式三首詩歌
          // -----------------------------------------------------------------
          if (r < 3) {
            [
              { colKey: 'worship', gridCol: 0 },
              { colKey: 'musician', gridCol: 1 },
              { colKey: 'slides', gridCol: 2 },
              { colKey: 'sound', gridCol: 3 }
            ].forEach(({ colKey, gridCol }) => {
              tr.appendChild(createNameCell(realIdx, colKey, r, week[colKey][r] || '', globalRow, gridCol));

            attachGridCellEvents(tdSongRow, globalRow, 0, false);

              <div class="flex items-center gap-1 h-full">
                <span class="inline-flex items-center justify-center text-[11px] font-black px-1.5 py-0.5 rounded border shrink-0 leading-none ${cfg.badgeCls}">
                  ${cfg.label}
                </span>
                <input type="text"
                  data-song-row="${globalRow}"
                  value="${escapeHtml(week.songs[cfg.key])}"
                  ${canEditRoster() ? '' : 'readonly'}
                  oninput="updateSongField(${realIdx}, '${cfg.key}', this.value)"
                  placeholder="${cfg.placeholder}"
                  class="w-full h-[24px] text-[14px] font-bold text-[#1E3323] bg-transparent px-1 rounded focus:bg-white focus:ring-1 focus:ring-[#3D7A47] focus:outline-none" />
              </div>
            `;
            const songInput = tdSongRow.querySelector('input');
            songInput.addEventListener('keydown', (e) => {
              if (e.isComposing || e.key !== 'Enter') return;
              if (e.shiftKey) return;
              e.preventDefault();
              let nextRow = globalRow + 1;
              if (nextRow % 6 === 0) nextRow += 3;
              const nextInput = document.querySelector(`input[data-song-row="${nextRow}"]`);
              if (nextInput) {
                nextInput.focus();
                nextInput.select();

                songInput.blur();

            if (r === 5) weekCells.push({activityCell,lastSongCell:tdSongRow});
