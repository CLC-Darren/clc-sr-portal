          // -----------------------------------------------------------------
          const tdUsherTag = document.createElement('td');
          const usherTagText = (week.usherTags[r] || '').trim();
          tdUsherTag.dataset.globalRow = globalRow;
          tdUsherTag.dataset.gridCol = 5;
          tdUsherTag.dataset.isFixed = 'true';
          tdUsherTag.className = 'px-0.5 h-[31px] align-middle text-center bg-[#F7FAF7] select-none';
          attachGridCellEvents(tdUsherTag, globalRow, 5, false);
          tdUsherTag.innerHTML = usherTagText
            ? `<span contenteditable="${canManageRoster()}"
                onblur="updateTagArray(${realIdx}, 'usherTags', ${r}, this.innerText)"
                class="editable-cell inline-flex items-center justify-center w-[54px] h-[22px] text-[11px] font-bold rounded-full border border-[#C5DEC8] bg-[#EEF6EE] text-[#2C5E34] leading-none whitespace-nowrap">${escapeHtml(usherTagText)}</span>`
            : `<span contenteditable="${canManageRoster()}"
                onblur="updateTagArray(${realIdx}, 'usherTags', ${r}, this.innerText)"
                class="editable-cell inline-flex items-center justify-center w-[54px] h-[22px] text-[11px] rounded-full text-transparent"></span>`;
          tr.appendChild(tdUsherTag);
          tr.appendChild(createNameCell(realIdx, 'usher', r, week.usher[r] || '', globalRow, 6));

          // -----------------------------------------------------------------
          // COLUMN 8: 愛宴 (gridCol = 7)
          // -----------------------------------------------------------------
          tr.appendChild(createNameCell(realIdx, 'meal', r, week.meal[r] || '', globalRow, 7));

          // -----------------------------------------------------------------
          // COLUMN 9: 接送 — Fixed Vehicle Pill (gridCol = 8) + Name (gridCol = 9)
          // -----------------------------------------------------------------
          const tdCar = document.createElement('td');
          const carLabel = (week.shuttleCars[r] || '').trim();
          const isChurchCar = carLabel.includes('教會車');
          tdCar.dataset.globalRow = globalRow;
          tdCar.dataset.gridCol = 8;
          tdCar.dataset.isFixed = 'true';
          tdCar.className = 'px-0.5 h-[31px] align-middle text-center bg-[#F7FAF7] select-none';
          attachGridCellEvents(tdCar, globalRow, 8, false);

          if (carLabel) {
            let innerCarHtml = escapeHtml(carLabel);
            if (isChurchCar && carLabel.includes(' ')) {
              const parts = carLabel.split(/\s+/);
              innerCarHtml = `${escapeHtml(parts[0])}<br/>${escapeHtml(parts.slice(1).join(' '))}`;
            }
            const carBadgeStyle = isChurchCar
              ? 'border-[#8BC3CB] bg-[#E6F4F6] text-[#1E5B70] font-black text-[10px] leading-[1.06]'
              : 'border-[#C5DEC8] bg-[#EEF6EE] text-[#2C5E34] font-bold text-[11px] leading-none';

            tdCar.innerHTML = `<span contenteditable="${canManageRoster()}"
              onblur="updateTagArray(${realIdx}, 'shuttleCars', ${r}, this.innerText)"
              class="editable-cell inline-flex flex-col items-center justify-center w-[64px] h-[25px] rounded-lg border px-0.5 text-center ${carBadgeStyle}">${innerCarHtml}</span>`;
          } else {
            tdCar.innerHTML = `<span contenteditable="${canManageRoster()}"
              onblur="updateTagArray(${realIdx}, 'shuttleCars', ${r}, this.innerText)"
              class="editable-cell inline-flex items-center justify-center w-[64px] h-[25px] rounded-lg text-transparent"></span>`;
          }
          tr.appendChild(tdCar);
          tr.appendChild(createNameCell(realIdx, 'shuttle', r, week.shuttle[r] || '', globalRow, 9));

          // -----------------------------------------------------------------
          // COLUMN 10: 點名 (gridCol = 10)
          // -----------------------------------------------------------------
          tr.appendChild(createNameCell(realIdx, 'rollcall', r, week.rollcall[r] || '', globalRow, 10));

          // -----------------------------------------------------------------
          // COLUMN 11: 交誼廳 — Vertical Label (gridCol = 11) + Reception (gridCol = 12)
          //                     Vertical Label (gridCol = 13) + BP (gridCol = 14)
          // -----------------------------------------------------------------
          if (r === 0) {
            const tdVerticalRecLabel = document.createElement('td');
            tdVerticalRecLabel.rowSpan = 6;
            tdVerticalRecLabel.dataset.globalRowStart = displayIdx * 6;
            tdVerticalRecLabel.dataset.globalRowEnd = displayIdx * 6 + 5;
            tdVerticalRecLabel.dataset.gridCol = 11;
            tdVerticalRecLabel.dataset.isFixed = 'true';
            const vDividerClass = isMonthEnd ? 'month-divider-cell' : 'week-divider-cell';
            tdVerticalRecLabel.className = `bg-[#EEF6EE] ${vDividerClass} text-[#2C5E34] font-bold text-[12px] text-center align-middle py-1 select-none cursor-pointer hover:bg-[#DCECDC] leading-none`;
            attachGridCellEvents(tdVerticalRecLabel, displayIdx * 6, 11, false);
            tdVerticalRecLabel.innerHTML = `<div class="vertical-zh-single mx-auto">交誼廳接待</div>`;
            tr.appendChild(tdVerticalRecLabel);
          }
          tr.appendChild(createNameCell(realIdx, 'loungeReception', r, week.loungeReception[r] || '', globalRow, 12));

          if (r === 0) {
            const tdVerticalBpLabel = document.createElement('td');
            tdVerticalBpLabel.rowSpan = 6;
            tdVerticalBpLabel.dataset.globalRowStart = displayIdx * 6;
            tdVerticalBpLabel.dataset.globalRowEnd = displayIdx * 6 + 5;
            tdVerticalBpLabel.dataset.gridCol = 13;
            tdVerticalBpLabel.dataset.isFixed = 'true';
            const bpDividerClass = isMonthEnd ? 'month-divider-cell' : 'week-divider-cell';
            tdVerticalBpLabel.className = `bg-[#E6F4F6] ${bpDividerClass} text-[#23626E] font-bold text-[12px] text-center align-middle py-1 select-none cursor-pointer hover:bg-[#D3ECF0] leading-none`;
            attachGridCellEvents(tdVerticalBpLabel, displayIdx * 6, 13, false);
            tdVerticalBpLabel.innerHTML = `<div class="vertical-zh-single mx-auto">量血壓</div>`;
            tr.appendChild(tdVerticalBpLabel);
          }
          tr.appendChild(createNameCell(realIdx, 'loungeBP', r, week.loungeBP[r] || '', globalRow, 14));

          // -----------------------------------------------------------------
          // COLUMN 12 & 13: 體操 (gridCol = 15) & 值班 (gridCol = 16)
          // -----------------------------------------------------------------
          tr.appendChild(createNameCell(realIdx, 'exercise', r, week.exercise[r] || '', globalRow, 15));
          tr.appendChild(createNameCell(realIdx, 'duty', r, week.duty[r] || '', globalRow, 16));

          tbody.appendChild(tr);
        }
      });

      alignDesktopEvents(weekCells);
      if (typeof ResizeObserver !== 'undefined') {
        desktopEventObserver = new ResizeObserver(() => alignDesktopEvents(weekCells));
        for (const {activityCell,lastSongCell} of weekCells) {
          desktopEventObserver.observe(activityCell);
          desktopEventObserver.observe(lastSongCell);
        }
      }
      updateSelectionVisuals();
    }

    function focusEditableCell(td) {
      if (!td) return;
      const target = td.querySelector('.roster-name-editor') || td;
      target.focus();
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      if (sel) {
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function insertNewlineInCell() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode('\n');
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function moveToNextEditableCellInColumn(globalRow, gridCol) {
      const colSpec = GRID_COLS[gridCol];
      if (!colSpec || colSpec.type !== 'editable') return null;

      let candidateRow = globalRow + 1;
      // For 3-row columns (worship/musician/slides/sound), skip song rows 3..5 to next week's row 0
      if (colSpec.maxRow === 3 && (candidateRow % 6) >= 3) {
        candidateRow = (Math.floor(globalRow / 6) + 1) * 6;
      }

      const nextTd = document.querySelector(
        `#roster-tbody td[data-global-row="${candidateRow}"][data-grid-col="${gridCol}"][data-editable-cell="true"]`
      );
      if (nextTd) {
        selectionRange = { startR: candidateRow, startC: gridCol, endR: candidateRow, endC: gridCol };
        updateSelectionVisuals();
        focusEditableCell(nextTd);
      }
      return nextTd;
    }

    function createNameCell(weekIdx, colKey, rowIdx, value, globalRow, gridCol) {
      const weeks = quarter().weeks;
      const td = document.createElement('td');
      const editor = document.createElement('div');
      const isChanged = weeks[weekIdx].changedCells[`${colKey}:${rowIdx}`];
      const isPraiseExerciseNote = colKey === 'exercise' && (value === '讚美操' || value === '健康操');
      const editable = canEditRoster();

      td.dataset.weekIdx = weekIdx;
      td.dataset.colKey = colKey;
      td.dataset.rowIdx = rowIdx;
      td.dataset.globalRow = globalRow;
      td.dataset.gridCol = gridCol;
      td.dataset.editableCell = String(editable);

      td.className = `roster-name-cell text-center text-[16px] font-bold tracking-normal ${
        isChanged
          ? 'bg-[#E53E3E] text-white font-black'
          : isPraiseExerciseNote
            ? 'text-[#C83E6B] font-bold'
            : 'text-[#1E3323]'
      }`;

      editor.className = 'roster-name-editor';
      editor.contentEditable = String(editable);
      editor.textContent = value;
      td.appendChild(editor);

      attachGridCellEvents(td, globalRow, gridCol, editable);

      function storeName() {
        if (!canEditRoster()) return;
        // Preserve internal newlines created by Shift+Enter while stripping trailing empty lines
        const cleaned = editor.innerText.replace(/\r\n/g, '\n').replace(/\n+$/, '');
        if (weeks[weekIdx][colKey][rowIdx] === cleaned) return;
        weeks[weekIdx][colKey][rowIdx] = cleaned;
        saveRosterDraft();
      }
      editor.oninput = event => { if (!event.isComposing) storeName(); };
      editor.oncompositionend = storeName;
      editor.onblur = () => { storeName(); renderMobileCards(); };

      editor.addEventListener('keydown', (e) => {
        if (e.isComposing) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          if (e.shiftKey) {
            // Shift + Enter: insert newline inside inner div (fixed 31px height clips overflow)
            if (canEditRoster()) {
              insertNewlineInCell();
              storeName();
            }
          } else {
            // Enter: save and move directly to next cell without inserting newline
            storeName();
            const moved = moveToNextEditableCellInColumn(globalRow, gridCol);
            if (!moved) editor.blur();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          storeName();
          editor.blur();
          extraRanges = [];
          selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
          updateSelectionVisuals();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          storeName();
          editor.blur();
          navigateGridByArrow(e.shiftKey ? 'ArrowLeft' : 'ArrowRight', false, true);
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          storeName();
          editor.blur();
          navigateGridByArrow(e.key, false, false);
        }
      });

      editor.onpaste = (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text');
        if (text && (text.includes('\n') || text.includes('\t'))) {
          e.preventDefault();
          applyRectangularPaste(text);
        }
      };

      return td;
    }

    // =========================================================================
    // 4. GOOGLE SHEETS SELECTION, ARROW NAVIGATION, CTRL MULTI-SELECT, COPY & PASTE
    // =========================================================================
    let isTouchInteraction = false;

    function attachGridCellEvents(td, globalRow, gridCol, isEditableName) {
      td.addEventListener('touchstart', () => {
        isTouchInteraction = true;
      }, { passive: true });

      td.addEventListener('touchend', () => {
        if (!isEditableName) return;
        // Single tap on touch devices immediately enters inline edit mode and opens keyboard
        extraRanges = [];
        selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
        updateSelectionVisuals();
        const target = td.querySelector('.roster-name-editor') || td;
        if (document.activeElement !== target) {
          target.focus();
        }
      }, { passive: true });

      td.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        // On touch devices (synthetic mousedown after touchstart) or double-click on desktop, allow native focus & keyboard
        if ((isTouchInteraction || e.detail >= 2) && isEditableName) {
          isTouchInteraction = false;
          extraRanges = [];
          selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
          updateSelectionVisuals();
          return;
        }
        isTouchInteraction = false;

        // Prevent native browser blue text highlight on desktop drag grid selection
        e.preventDefault();
        const winSel = window.getSelection();
        if (winSel) winSel.removeAllRanges();
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }

        if (e.shiftKey) {
          selectionRange.endR = globalRow;
          selectionRange.endC = gridCol;
          updateSelectionVisuals();
          return;
        }

        if (e.ctrlKey || e.metaKey) {
          // Ctrl/Cmd + Click: keep previous ranges and start an additional selection range
          extraRanges.push({ ...selectionRange });
          selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
          isDraggingSelection = true;
          updateSelectionVisuals();
          return;
        }

        // Start a fresh rectangular selection
        extraRanges = [];
        selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
        isDraggingSelection = true;
        updateSelectionVisuals();
      });

      td.addEventListener('mouseenter', () => {
        if (!isDraggingSelection) return;
        selectionRange.endR = globalRow;
        selectionRange.endC = gridCol;
        updateSelectionVisuals();
      });
    }

    document.addEventListener('mouseup', () => {
      if (isDraggingSelection) {
        isDraggingSelection = false;
      }
    });

    function normalizeOneRange(r) {
      return {
        minR: Math.min(r.startR, r.endR),
        maxR: Math.max(r.startR, r.endR),
        minC: Math.min(r.startC, r.endC),
        maxC: Math.max(r.startC, r.endC)
      };
    }

    function getNormalizedRange() {
      return normalizeOneRange(selectionRange);
    }

    function getAllNormalizedRanges() {
      return [...extraRanges.map(normalizeOneRange), normalizeOneRange(selectionRange)];
    }

    function updateSelectionVisuals() {
      const allRanges = getAllNormalizedRanges();
      const activeNorm = getNormalizedRange();
      const isSingleActiveCell = activeNorm.minR === activeNorm.maxR && activeNorm.minC === activeNorm.maxC;

      document.querySelectorAll('#roster-tbody td').forEach(td => {
        td.classList.remove(
          'gs-in-range',
          'gs-selected-cell',
          'gs-range-corner'
        );

        let rStart, rEnd, cStart, cEnd;
        if (td.dataset.globalRow !== undefined && td.dataset.gridCol !== undefined) {
          rStart = rEnd = Number(td.dataset.globalRow);
          cStart = cEnd = Number(td.dataset.gridCol);
        } else if (td.dataset.globalRowStart !== undefined && td.dataset.gridCol !== undefined) {
          rStart = Number(td.dataset.globalRowStart);
          rEnd = Number(td.dataset.globalRowEnd);
          cStart = cEnd = Number(td.dataset.gridCol);
        } else if (td.dataset.globalRow !== undefined && td.dataset.gridColStart !== undefined) {
          rStart = rEnd = Number(td.dataset.globalRow);
          cStart = Number(td.dataset.gridColStart);
          cEnd = Number(td.dataset.gridColEnd);
        } else {
          return;
        }

        const inAnyRange = allRanges.some(rng => !(rEnd < rng.minR || rStart > rng.maxR || cEnd < rng.minC || cStart > rng.maxC));
        if (!inAnyRange) return;

        const isExactActiveSingle = isSingleActiveCell &&
          rStart === activeNorm.minR && rEnd === activeNorm.maxR &&
          cStart === activeNorm.minC && cEnd === activeNorm.maxC;

        if (isExactActiveSingle) {
          td.classList.add('gs-selected-cell', 'gs-range-corner');
        } else {
          td.classList.add('gs-in-range');
        }
      });
    }

    function scrollCellIntoViewIfNeeded(globalRow, gridCol) {
      const td = document.querySelector(`#roster-tbody td[data-global-row="${globalRow}"][data-grid-col="${gridCol}"]`) ||
        document.querySelector(`#roster-tbody td[data-global-row="${globalRow}"]`);
      if (td && td.scrollIntoView) {
        td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }

    function getTotalGridRows() {
      const visibleWeeks = rosterSchedule().filter(item => !item.announcement);
      return visibleWeeks.length * 6;
    }

    function navigateGridByArrow(key, extendShift = false, editableOnly = false) {
      const totalRows = getTotalGridRows();
      if (totalRows <= 0) return;
      const maxCol = GRID_COLS.length - 1;

      let r = extendShift ? selectionRange.endR : selectionRange.startR;
      let c = extendShift ? selectionRange.endC : selectionRange.startC;

      const stepR = key === 'ArrowUp' ? -1 : key === 'ArrowDown' ? 1 : 0;
      const stepC = key === 'ArrowLeft' ? -1 : key === 'ArrowRight' ? 1 : 0;

      let nextR = Math.max(0, Math.min(totalRows - 1, r + stepR));
      let nextC = Math.max(0, Math.min(maxCol, c + stepC));

      // Skip merged song rows (rows 3..5 in cols 0..3) cleanly when navigating vertically or horizontally
      if (stepR !== 0 && nextC <= 3 && (nextR % 6) >= 3) {
        const weekBase = Math.floor(nextR / 6) * 6;
        if (stepR > 0) {
          nextR = Math.min(totalRows - 1, weekBase + 6);
        } else {
          nextR = Math.max(0, weekBase + 2);
        }
      }
      if (stepC !== 0 && nextC <= 3 && (nextR % 6) >= 3) {
        nextC = stepC < 0 ? 16 : 4;
      }

      if (editableOnly) {
        let guard = 0;
        while (guard++ < 40 && !resolveGridCoordinate(nextR, nextC)) {
          if (stepC !== 0) {
            nextC += stepC;
            if (nextC > maxCol) { nextC = 0; nextR = Math.min(totalRows - 1, nextR + 1); }
            if (nextC < 0) { nextC = maxCol; nextR = Math.max(0, nextR - 1); }
          } else {
            nextR = Math.max(0, Math.min(totalRows - 1, nextR + stepR));
            break;
          }
        }
      }

      if (extendShift) {
        selectionRange.endR = nextR;
        selectionRange.endC = nextC;
      } else {
        extraRanges = [];
        selectionRange = { startR: nextR, startC: nextC, endR: nextR, endC: nextC };
      }
      updateSelectionVisuals();
      scrollCellIntoViewIfNeeded(nextR, nextC);
    }

    // Resolve a (globalRow, gridCol) coordinate to an editable cell or null if fixed/skipped
    function resolveGridCoordinate(globalRow, gridCol) {
      const colSpec = GRID_COLS[gridCol];
      if (!colSpec || colSpec.type !== 'editable') return null;

      const visibleItems = rosterSchedule().filter(item => !item.announcement);
      const displayIdx = Math.floor(globalRow / 6);
      const rowInWeek = globalRow % 6;
      if (displayIdx < 0 || displayIdx >= visibleItems.length) return null;
      if (rowInWeek >= colSpec.maxRow) return null; // Skip song rows under worship/musician/slides/sound

      return {
        weekIdx: visibleItems[displayIdx].realIdx,
        colKey: colSpec.key,
        rowIdx: rowInWeek
      };
    }

    function buildSelectedRangeTsv() {
      const allRanges = getAllNormalizedRanges();
      const weeks = quarter().weeks;

      // Single rectangular range (standard behavior)
      if (allRanges.length === 1) {
        const { minR, maxR, minC, maxC } = allRanges[0];
        const tsvRows = [];
        for (let r = minR; r <= maxR; r++) {
          const rowVals = [];
          for (let c = minC; c <= maxC; c++) {
            const target = resolveGridCoordinate(r, c);
            rowVals.push(target ? (weeks[target.weekIdx][target.colKey][target.rowIdx] || '') : '');
          }
          tsvRows.push(rowVals.join('	'));
        }
        return {
          tsvText: tsvRows.join('\n'),
          rowCount: maxR - minR + 1,
          colCount: maxC - minC + 1
        };
      }

      // Multiple Ctrl-selected ranges: bounding box TSV of selected cells
      const minR = Math.min(...allRanges.map(r => r.minR));
      const maxR = Math.max(...allRanges.map(r => r.maxR));
      const minC = Math.min(...allRanges.map(r => r.minC));
      const maxC = Math.max(...allRanges.map(r => r.maxC));
      const tsvRows = [];
      let selectedCount = 0;

      for (let r = minR; r <= maxR; r++) {
        const rowVals = [];
        for (let c = minC; c <= maxC; c++) {
          const isPicked = allRanges.some(rng => r >= rng.minR && r <= rng.maxR && c >= rng.minC && c <= rng.maxC);
          if (!isPicked) {
            rowVals.push('');
            continue;
          }
          selectedCount++;
          const target = resolveGridCoordinate(r, c);
          rowVals.push(target ? (weeks[target.weekIdx][target.colKey][target.rowIdx] || '') : '');
        }
        tsvRows.push(rowVals.join('	'));
      }
      return {
        tsvText: tsvRows.join('\n'),
        rowCount: maxR - minR + 1,
        colCount: maxC - minC + 1,
        selectedCount
      };
    }

    function copyTextFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (err) {}
      document.body.removeChild(ta);
    }

    // Standard Ctrl+C / Cmd+C for rectangular or Ctrl multi-cell selection
    document.addEventListener('copy', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      const winSel = window.getSelection();
      if (winSel && winSel.toString().length > 0 && document.activeElement && document.activeElement.isContentEditable) {
        return;
      }

      const { tsvText, rowCount, colCount, selectedCount } = buildSelectedRangeTsv();
      e.preventDefault();
      if (e.clipboardData) {
        e.clipboardData.setData('text/plain', tsvText);
      } else {
        copyTextFallback(tsvText);
      }
      showToast(selectedCount ? `已複製 ${selectedCount} 格跳選資料` : `已複製 ${rowCount} 列 × ${colCount} 欄矩形資料`);
    });

    // Google Sheets keyboard shortcuts: Arrow navigation, Shift+Arrow range, Ctrl+A, Ctrl+C, F2 / direct typing, Delete
    document.addEventListener('keydown', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (document.activeElement && document.activeElement.isContentEditable) return;

      // Arrow keys: move active cell or extend range with Shift
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        navigateGridByArrow(e.key, e.shiftKey, false);
        return;
      }

      // Ctrl+A / Cmd+A: select entire table grid
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        const totalRows = getTotalGridRows();
        if (totalRows > 0) {
          e.preventDefault();
          extraRanges = [];
          selectionRange = { startR: 0, startC: 0, endR: totalRows - 1, endC: GRID_COLS.length - 1 };
          updateSelectionVisuals();
        }
        return;
      }

      // Ctrl+C / Cmd+C
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        const { tsvText, rowCount, colCount, selectedCount } = buildSelectedRangeTsv();
        copyTextFallback(tsvText);
        showToast(selectedCount ? `已複製 ${selectedCount} 格跳選資料` : `已複製 ${rowCount} 列 × ${colCount} 欄矩形資料`);
        return;
      }

      // Enter: move down one cell
      if (e.key === 'Enter' && !e.shiftKey) {
        const { minR, minC } = getNormalizedRange();
        const moved = moveToNextEditableCellInColumn(minR, minC);
        if (moved) e.preventDefault();
        return;
      }

      // F2: enter inline edit mode on selected cell
      if (e.key === 'F2' && canEditRoster()) {
        const td = document.querySelector(
          `#roster-tbody td[data-global-row="${selectionRange.startR}"][data-grid-col="${selectionRange.startC}"][data-editable-cell="true"]`
        );
        if (td) {
          e.preventDefault();
          focusEditableCell(td);
        }
        return;
      }

      // Delete / Backspace: clear all selected cells (including Ctrl multi-selected ranges)
      if (canEditRoster() && (e.key === 'Delete' || e.key === 'Backspace')) {
        const allRanges = getAllNormalizedRanges();
        const weeks = quarter().weeks;
        const visited = new Set();
        let cleared = 0;

        for (const rng of allRanges) {
          for (let r = rng.minR; r <= rng.maxR; r++) {
            for (let c = rng.minC; c <= rng.maxC; c++) {
              const key = `${r}:${c}`;
              if (visited.has(key)) continue;
              visited.add(key);
              const target = resolveGridCoordinate(r, c);
              if (!target) continue;
              weeks[target.weekIdx][target.colKey][target.rowIdx] = '';
              cleared++;
            }
          }
        }
        if (cleared > 0) {
          saveRosterDraft();
          e.preventDefault();
          renderDesktopTable();
          renderMobileCards();
          showToast(`已清除選取範圍內 ${cleared} 格姓名`);
        }
        return;
      }

      // Direct typing into selected cell (like Google Sheets) when pressing a printable character
      if (canEditRoster() && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
        const td = document.querySelector(
          `#roster-tbody td[data-global-row="${selectionRange.startR}"][data-grid-col="${selectionRange.startC}"][data-editable-cell="true"]`
        );
        const editor = td && td.querySelector('.roster-name-editor');
        if (editor) {
          editor.textContent = '';
          editor.focus();
        }
      }
    });

    // Multi-row & multi-column rectangular paste (supports filling Ctrl multi-selected cells if 1 value copied)
    function applyRectangularPaste(rawText) {
      if (!canEditRoster()) return;
      const cleanText = rawText.replace(/\r\n/g, '\n').replace(/\n$/, '');
      if (!cleanText) return;

      const matrix = cleanText.split('\n').map(row => row.split('\t'));
      const weeks = quarter().weeks;
      const flashedCoords = [];
      let pastedCount = 0;

      // If user Ctrl-selected multiple cells and copied a single cell value, fill all selected cells
      if (extraRanges.length > 0 && matrix.length === 1 && matrix[0].length === 1) {
        const fillVal = (matrix[0][0] || '').trim();
        const visited = new Set();
        for (const rng of getAllNormalizedRanges()) {
          for (let r = rng.minR; r <= rng.maxR; r++) {
            for (let c = rng.minC; c <= rng.maxC; c++) {
              const key = `${r}:${c}`;
              if (visited.has(key)) continue;
              visited.add(key);
              const target = resolveGridCoordinate(r, c);
              if (!target) continue;
              weeks[target.weekIdx][target.colKey][target.rowIdx] = fillVal;
              flashedCoords.push(target);
              pastedCount++;
            }
          }
        }
      } else {
        const { minR, minC } = getNormalizedRange();
        for (let rOff = 0; rOff < matrix.length; rOff++) {
          for (let cOff = 0; cOff < matrix[rOff].length; cOff++) {
            const targetR = minR + rOff;
            const targetC = minC + cOff;
            const target = resolveGridCoordinate(targetR, targetC);
            if (!target) continue; // Automatically skip fixed labels & song rows

            const val = (matrix[rOff][cOff] || '').trim();
            weeks[target.weekIdx][target.colKey][target.rowIdx] = val;
            flashedCoords.push(target);
            pastedCount++;
          }
        }
        if (pastedCount > 0) {
          extraRanges = [];
          selectionRange = {
            startR: minR,
            startC: minC,
            endR: minR + matrix.length - 1,
            endC: minC + Math.max(...matrix.map(r => r.length)) - 1
          };
        }
      }

      if (pastedCount > 0) {
        saveRosterDraft();
        renderDesktopTable();
        renderMobileCards();

        flashedCoords.forEach(t => {
          const cell = document.querySelector(
            `td[data-week-idx="${t.weekIdx}"][data-col-key="${t.colKey}"][data-row-idx="${t.rowIdx}"]`
          );
          if (cell) cell.classList.add('paste-flash');
        });
        showToast(`已貼上 ${pastedCount} 格資料（自動跳過固定欄位）`);
      }
    }

    document.addEventListener('paste', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (document.activeElement && document.activeElement.isContentEditable) return;

      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (text) {
        e.preventDefault();
        applyRectangularPaste(text);
      }
    });

    // =========================================================================
    // 5. WYSIWYG ADMIN CONTROLS (VERSION STATUS & WEEKLY ACTIVITY DROPDOWN)
    // =========================================================================
    const versionMenu = document.getElementById('version-status-menu');
    const activityActionMenu = document.getElementById('activity-action-menu');
    let activityMenuTargetWeekIdx = -1;

    function toggleVersionDropdown(e) {
      if (!canManageRoster()) return;
      e.stopPropagation();
      closeActivityActionMenu();
      versionMenu.hidden = !versionMenu.hidden;
    }

    function closeVersionDropdown() {
      if (versionMenu) versionMenu.hidden = true;
    }

    function selectVersionStatus(status) {
      if (!canManageRoster()) return;
      closeVersionDropdown();
      setVersionStatus(status, true);
      saveRosterDraft();
    }

    function setVersionStatus(status, notify = true) {
      versionStatus = status;
      const badge = document.getElementById('version-status-badge');
      const textEl = document.getElementById('version-status-text');
      if (textEl) textEl.textContent = status;

      if (badge) {
        if (status === '確認版') {
          badge.className = `inline-flex items-baseline gap-0.5 px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black bg-[#EEF6EE] text-[#2C5E34] border border-[#3D7A47]/40 ${canManageRoster() ? 'cursor-pointer' : 'cursor-default'}`;
        } else {
          badge.className = `inline-flex items-baseline gap-0.5 px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black bg-[#FEF5DC] text-[#9A6700] border border-[#F4BD3E] ${canManageRoster() ? 'cursor-pointer' : 'cursor-default'}`;
        }
      }
      if (notify) showToast(`已切換狀態為「${status}」`);
    }

    function updateHeaderRemark(val) {
      if (!canManageRoster()) return;
      const cleaned = val.trim();
      document.getElementById('header-remark-text').textContent = cleaned;
    }

    function openActivityActionMenu(e, weekIdx) {
      if (!canManageRoster()) return;
      e.stopPropagation();
      closeVersionDropdown();
      activityMenuTargetWeekIdx = weekIdx;

      const btnRect = e.currentTarget.getBoundingClientRect();
      activityActionMenu.hidden = false;
      const menuRect = activityActionMenu.getBoundingClientRect();
      const left = Math.min(btnRect.left, window.innerWidth - menuRect.width - 10);
      const top = Math.min(btnRect.bottom + 4, window.innerHeight - menuRect.height - 10);
      activityActionMenu.style.left = `${Math.max(8, left)}px`;
      activityActionMenu.style.top = `${Math.max(8, top)}px`;
    }

    function closeActivityActionMenu() {
      if (activityActionMenu) activityActionMenu.hidden = true;
    }

    function formatSuggestedDate(baseWeek, offsetDays) {
      const iso = isoWeek(baseWeek);
      if (!iso) return baseWeek.date || '新聚會日';
      const d = new Date(iso + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offsetDays);
      return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`;
    }

    function inferMonthFromDateStr(dateStr, fallbackMonth) {
      const m = /^(\d{1,2})月/.exec((dateStr || '').trim());
      return m ? Number(m[1]) : fallbackMonth;
    }

    function handleActivityMenuAction(action) {
      if (!canManageRoster()) return;
      const idx = activityMenuTargetWeekIdx;
      closeActivityActionMenu();
      const weeks = quarter().weeks;
      const targetWeek = weeks[idx];
      if (!targetWeek) return;

      if (action === 'pause') {
        const iso = isoWeek(targetWeek);
        if (!iso) {
          showToast('請先確認該週日期格式（例如：10月1日）');
          return;
        }
        const entries = calendar().filter(item => !(item.date === iso && item.type !== 'special'));
        updateCalendar([...entries, { date: iso, type: 'pause', label: '本週休會' }]);
        showToast(`已將 ${targetWeek.date} 設為「休會」（可直接點擊文字修改）`);
        return;
      }

      if (action === 'special') {
        const iso = isoWeek(targetWeek);
        if (!iso) {
          showToast('請先確認該週日期格式（例如：10月1日）');
          return;
        }
        const entries = calendar().filter(item => !(item.date === iso && item.type === 'special'));
        updateCalendar([...entries, { date: iso, type: 'special', label: '特別活動' }]);
        showToast(`已於 ${targetWeek.date} 新增「特殊活動」（可直接點擊文字修改）`);
        return;
      }

      if (action === 'insertBelow' || action === 'insertAbove') {
        const isBelow = action === 'insertBelow';
        const suggestedDate = formatSuggestedDate(targetWeek, isBelow ? 7 : -7);
        const suggestedMonth = inferMonthFromDateStr(suggestedDate, targetWeek.month);
        const newId = `${currentQuarterKey.toLowerCase()}-custom-${Date.now()}`;
        const blankWeek = createBlankWeek(newId, suggestedMonth, suggestedDate, 4);
        const insertPos = isBelow ? idx + 1 : idx;
        weeks.splice(insertPos, 0, blankWeek);
        saveRosterDraft();
        updateQuarterHeaderAndTabs();
        renderDesktopTable();
        renderMobileCards();
        showToast(isBelow ? `已在下方新增空白聚會（${suggestedDate}）` : `已在上方新增空白聚會（${suggestedDate}）`);
      }
    }

    document.addEventListener('click', (e) => {
      if (versionMenu && !versionMenu.hidden && !document.getElementById('version-status-wrap')?.contains(e.target)) {
        closeVersionDropdown();
      }
      if (activityActionMenu && !activityActionMenu.hidden && !activityActionMenu.contains(e.target)) {
        closeActivityActionMenu();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeVersionDropdown();
        closeActivityActionMenu();
      }
    });

    // =========================================================================
    // 6. INTERACTIVE FIELD EDITING HELPERS
    // =========================================================================
    function cycleSpeakerType(weekIdx) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      const order = ['church', 'external', 'outing'];
      const curr = weeks[weekIdx].speakerType || 'church';
      const next = order[(order.indexOf(curr) + 1) % order.length];
      weeks[weekIdx].speakerType = next;
      saveRosterDraft();
      renderDesktopTable();
      renderMobileCards();
      showToast(`已切換講員分類為「${SPEAKER_STYLES[next].label}」`);
    }

    function updateTagArray(weekIdx, arrayKey, rowIdx, rawText) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      weeks[weekIdx][arrayKey][rowIdx] = rawText.replace(/\s+/g, ' ').trim();
      saveRosterDraft();
      renderDesktopTable();
      renderMobileCards();
    }

    function updateActivityField(weekIdx, field, val) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      const cleaned = val.trim();
      weeks[weekIdx][field] = cleaned === '輸入講員' ? '' : cleaned;
      saveRosterDraft();
      renderMobileCards();
    }

    function updateSongField(weekIdx, songKey, val) {
      if (!canEditRoster()) return;
      const weeks = quarter().weeks;
      weeks[weekIdx].songs[songKey] = val.trim();
      saveRosterDraft();
      renderMobileCards();
    }

    // Bottom-up special event stack helpers (first item at bottom, '+' stacks upward)
    function addEventItemUpward(weekIdx) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      if (!Array.isArray(weeks[weekIdx].events)) {
        weeks[weekIdx].events = [];
      }
      // Prepend so the first existing item stays at the very bottom and new items stack upward
      weeks[weekIdx].events.unshift({ text: '新活動項目', color: 'red' });
      saveRosterDraft();
      renderDesktopTable();
      renderMobileCards();
    }

    function updateEventItem(weekIdx, evIdx, val) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      const cleaned = val.trim();
      if (!cleaned) {
        weeks[weekIdx].events.splice(evIdx, 1);
        renderDesktopTable();
      } else {
        weeks[weekIdx].events[evIdx].text = cleaned;
      }
      saveRosterDraft();
      renderMobileCards();
    }

    function cycleEventColor(weekIdx, evIdx) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      const curr = weeks[weekIdx].events[evIdx].color || 'red';
      const next = EVENT_COLOR_KEYS[(EVENT_COLOR_KEYS.indexOf(curr) + 1) % EVENT_COLOR_KEYS.length];
      weeks[weekIdx].events[evIdx].color = next;
      saveRosterDraft();
      renderDesktopTable();
      renderMobileCards();
    }

    function removeEventItem(weekIdx, evIdx) {
      if (!canManageRoster()) return;
      const weeks = quarter().weeks;
      weeks[weekIdx].events.splice(evIdx, 1);
      saveRosterDraft();
      renderDesktopTable();
      renderMobileCards();
    }

    // =========================================================================
    // 7. RENDER MODERN iOS HIG / MATERIAL DESIGN 3 MOBILE ELDER CARDS (>= 16PX)
    // =========================================================================
    function renderMobileCards() {
      const container = document.getElementById('mobile-cards-list');
      if (!container) return;
      container.innerHTML = '';

      const visibleItems = rosterSchedule();
      visibleItems.forEach((item, displayIdx) => {
        if (item.announcement) {
          container.append(renderMobileAnnouncement(item));
          return;
        }
        const {week} = item;
        const prevItem = visibleItems[displayIdx - 1];
        if (prevItem && prevItem.month !== week.month) {
          const divider = document.createElement('div');
          divider.className = 'pt-3 pb-1';
          divider.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="h-[2px] flex-1 bg-[#3D7A47]/30"></div>
              <span class="text-[17px] font-black text-[#2C5E34] bg-white px-4 py-1.5 rounded-full border-2 border-[#3D7A47] shadow-2xs">
                📅 ${week.month} 月份服事
              </span>
              <div class="h-[2px] flex-1 bg-[#3D7A47]/30"></div>
            </div>
          `;
          container.appendChild(divider);
        }

        const roleDefs = [
          { key: 'worship', label: '敬拜', icon: '🎤' },
          { key: 'musician', label: '樂手', icon: '🎹' },
          { key: 'slides', label: '投影片', icon: '🖥️' },
          { key: 'sound', label: '音控', icon: '🎚️' },
          { key: 'photo', label: '攝影', icon: '📷' },
          { key: 'usher', label: '招待', icon: '🤝', tagKey: 'usherTags' },
          { key: 'meal', label: '愛宴', icon: '🍱' },
          { key: 'shuttle', label: '接送', icon: '🚐', tagKey: 'shuttleCars' },
          { key: 'rollcall', label: '點名', icon: '📋' },
          { key: 'loungeReception', label: '交誼廳接待', icon: '☕' },
          { key: 'loungeBP', label: '量血壓', icon: '🩺' },
          { key: 'exercise', label: '體操', icon: '🤸' },
          { key: 'duty', label: '值班', icon: '🔔' }
        ];

        const roleBlocks = [];

        roleDefs.forEach(def => {
          const names = week[def.key] || [];
          const tags = def.tagKey ? (week[def.tagKey] || []) : [];
          const items = [];

          names.forEach((rawName, idx) => {
            const name = (rawName || '').trim();
            if (!name) return;
            items.push({
              name,
              tag: (tags[idx] || '').trim(),
              isChanged: !!week.changedCells[`${def.key}:${idx}`]
            });
          });

          if (items.length > 0) {
            roleBlocks.push({ label: def.label, icon: def.icon, items });
          }
        });

        const spStyle = SPEAKER_STYLES[week.speakerType] || SPEAKER_STYLES.church;
        const eventsList = Array.isArray(week.events) ? week.events : [];
        const card = document.createElement('article');
        card.className = 'bg-white rounded-[26px] border border-[#D4E4D6] shadow-sm overflow-hidden';

        // Special events pills (all >= 16px)
        const eventsHtml = eventsList.length > 0
          ? `<div class="pt-2.5 flex flex-wrap gap-2">
              ${eventsList.map(ev => {
                const cCfg = EVENT_COLORS[ev.color] || EVENT_COLORS.red;
                return `<span class="text-[16px] font-bold px-3 py-1 rounded-xl ${cCfg.badgeBg}">${escapeHtml(ev.text)}</span>`;
              }).join('')}
            </div>`
          : '';

        // Roles list in clean iOS Inset Grouped / Material 3 List style (all >= 16px)
        const rolesHtml = roleBlocks.length > 0
          ? roleBlocks.map(block => {
              const peopleHtml = block.items.map(it => {
                const tagBadge = it.tag
                  ? `<span class="inline-block ml-1.5 px-2.5 py-0.5 rounded-lg bg-[#EEF6EE] text-[#2C5E34] border border-[#C5DEC8] text-[16px] font-bold">${escapeHtml(it.tag)}</span>`
                  : '';
                if (it.isChanged) {
                  return `<span class="inline-flex items-center flex-wrap bg-[#E53E3E] text-white px-2.5 py-0.5 rounded-xl text-[17px] font-black">${escapeHtml(it.name)}・異動</span>${tagBadge}`;
                }
                return `<span class="inline-flex items-center flex-wrap"><span class="text-[18px] font-bold text-[#1E3323]">${escapeHtml(it.name)}</span>${tagBadge}</span>`;
              }).join('<span class="text-[17px] text-[#9BBF9F] mx-1.5">、</span>');

              return `
                <div class="py-3.5 px-4 border-b border-[#EDF3EE] last:border-b-0 flex flex-col gap-1.5">
                  <div class="flex items-center gap-2 text-[16px] font-black text-[#3D7A47]">
                    <span>${block.icon}</span>
                    <span>${block.label}</span>
                  </div>
                  <div class="pl-7 leading-relaxed">${peopleHtml}</div>
                </div>
              `;
            }).join('')
          : `<div class="py-6 text-center text-[17px] text-[#6C8570] font-bold">本週尚無同工排班名單</div>`;

        card.innerHTML = `
          <!-- Card Header: Date + Speaker + Topic + Events -->
          <div class="p-5 bg-[#FCFDFB] border-b border-[#E3EDE4] space-y-2.5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <span class="text-[24px] font-black text-[#2C5E34] tracking-tight">${escapeHtml(week.date)}</span>
              <span class="text-[18px] font-black px-3.5 py-1 rounded-2xl border-2 ${spStyle.cls}">
                ${escapeHtml(week.speaker) || '講員待定'}
              </span>
            </div>
            ${week.topic ? `<div class="text-[18px] font-bold text-[#1E5B70] leading-snug">${escapeHtml(week.topic)}</div>` : ''}
            ${eventsHtml}
          </div>

          <!-- Worship Songs Surface Card -->
          <div class="bg-[#F2F7F2] px-5 py-3.5 border-b border-[#E3EDE4] space-y-2">
            <div class="text-[16px] font-black text-[#2C5E34]">🎵 敬拜詩歌</div>
            <div class="space-y-1.5">
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#FEF5DC] text-[#9A6700] border border-[#F4BD3E] font-black text-[16px] shrink-0">快歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.fast) || '—'}</span>
              </div>
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#E6F4F6] text-[#1E5B70] border border-[#8BC3CB] font-black text-[16px] shrink-0">慢歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.slow1) || '—'}</span>
              </div>
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#E6F4F6] text-[#1E5B70] border border-[#8BC3CB] font-black text-[16px] shrink-0">慢歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.slow2) || '—'}</span>
              </div>
            </div>
          </div>

          <!-- Grouped Ministry Roster Rows -->
          <div class="divide-y divide-[#EDF3EE]">
            ${rolesHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-text').textContent = msg;
      box.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        box.classList.add('translate-y-24', 'opacity-0');
      }, 2600);
    }

    const viewSwitch = document.getElementById('roster-view-switch');
    viewSwitch.addEventListener('click',event => {
      const button = event.target.closest('[data-roster-view]');
      if (!button) return;
      document.body.classList.toggle('roster-table-view',button.dataset.rosterView === 'table');
      for (const choice of viewSwitch.querySelectorAll('button')) {
        choice.setAttribute('aria-pressed',String(choice === button));
      }
      setRosterSearchOpen(false);
    });

    function resizeRosterViewport() {
      const viewport = document.getElementById('roster-scroll');
      const firstRow = viewport.querySelector('thead tr');
      viewport.style.setProperty('--roster-top',Math.max(0,viewport.getBoundingClientRect().top)+'px');
      if (firstRow.offsetHeight) viewport.style.setProperty('--roster-first-row',firstRow.getBoundingClientRect().height+'px');
    }
    window.addEventListener('resize',resizeRosterViewport);
    let lastKnownSuperuser = canManageRoster();
    function syncAdminUiState() {
      const curr = canManageRoster();
      if (curr === lastKnownSuperuser) return;
      lastKnownSuperuser = curr;
      renderRosterSettings();
      renderDesktopTable();
    }
    window.addEventListener('clc-admin-changed', syncAdminUiState);
    setInterval(syncAdminUiState, 600);
    window.addEventListener('DOMContentLoaded', () => {
      restoreRosterDraft();
      const params = new URLSearchParams(location.search);
      const requestedQuarter = params.get('q') || params.get('quarter');
      if (requestedQuarter && /^202[67]-Q[1-4]$/.test(requestedQuarter)) {
        currentQuarterKey = requestedQuarter;
      }
      ensureQuarterExists(currentQuarterKey);
      document.getElementById('year-selector').value = currentQuarterKey.split('-')[0];
      showRosterDraftStatus();
      // Connect to Firebase initialized by /header.js as soon as ready
      subscribeQuarterFromFirebase(currentQuarterKey);
      let watchedAuth = initFirebaseAdminWatcher();
      let fbRetryCount = 0;
      const fbBootTimer = setInterval(() => {
        fbRetryCount++;
        if (!firebaseUnsubscribe) subscribeQuarterFromFirebase(currentQuarterKey);
        if (!watchedAuth) watchedAuth = initFirebaseAdminWatcher();
        syncAdminUiState();
        if ((firebaseUnsubscribe && watchedAuth) || fbRetryCount >= 15) {
          clearInterval(fbBootTimer);
        }
      }, 300);
      setVersionStatus(versionStatus, false);
      renderRosterSettings();
      resetRosterSearch();
      resizeRosterViewport();
      if (typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(resizeRosterViewport);
        document.querySelectorAll('body > header, #roster-search, .roster-table thead tr:first-child').forEach(box => observer.observe(box));
      }
      updateQuarterHeaderAndTabs();
      renderDesktopTable();
      renderMobileCards();
    });
  </script>

  <script src="/header.js?v=20261126-serve"></script>
