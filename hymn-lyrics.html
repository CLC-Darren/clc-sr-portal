<!DOCTYPE html>

<head>

  <script>
    tailwind.config = {darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','"Noto Sans TC"','sans-serif']},colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}};

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    html,body {margin:0; width:100%; height:100%;}
    body { font-family: "Plus Jakarta Sans","Noto Sans TC",sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
    .frame-shell {display:flex; flex-direction:column; height:100dvh; height:100vh;}
    @supports (height:100dvh) {.frame-shell {height:100dvh;}}
    #clc-header {flex:none;}
    .frame-toolbar {flex:none; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 15px; background:rgba(255,255,255,.7); border-bottom:1px solid #e2e8f0; font-size:13px;}
    .dark .frame-toolbar {background:#11131B; border-bottom-color:rgba(255,255,255,.1);}
    .frame-toolbar a {color:#007E8A; text-decoration:none; font-weight:700; white-space:nowrap;}
    .dark .frame-toolbar a {color:#5eead4;}
    .frame-toolbar strong {white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .frame-content {flex:1; min-height:0; width:100%; display:block; border:0; background:transparent;}
    .frame-notice {flex:none; padding:5px 12px; text-align:center; font-size:11px; color:#64748b; background:#f8fafc; border-top:1px solid #e2e8f0;}
    .dark .frame-notice {background:#090A0F; color:#94a3b8; border-top-color:rgba(255,255,255,.08);}
    .dark .frame-shell {background:#090A0F; color:#f8fafc;}
  </style>
  <script>
    (function(){const media=window.matchMedia('(prefers-color-scheme: dark)'); const saved=localStorage.getItem('theme');document.documentElement.classList.toggle('dark',saved==='dark'||(saved!=='light'&&media.matches));})();
  </script>
</head>
<body>
  <div class="frame-shell">

    </div>
    <iframe

      title="CLC 共用歌詞工具（YA 主站）"
      src="https://clc-ya-portal.pages.dev/hymn-lyrics?neutral=1"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <div class="frame-notice">歌詞與製作工具由 YA 主站同步提供；若嵌入頁無法操作列印或下載，請點「在原站開啟」。</div>
