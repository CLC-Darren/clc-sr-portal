<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CLC SR | 詩歌歌詞下載</title>
  <meta name="theme-color" content="#007E8A">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="favicon.svg?v=sr-icon-20261109-v2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=sr-icon-20261109-v2">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','"Noto Sans TC"','sans-serif']},colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html,body {margin:0; width:100%; height:100%;}
    body { font-family: Inter,"Noto Sans TC",sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
    .frame-shell {display:flex; flex-direction:column; height:100dvh; height:100vh;}
    @supports (height:100dvh) {.frame-shell {height:100dvh;}}
    #clc-header {flex:none;}
    .frame-content {flex:1; min-height:0; width:100%; display:block; border:0; background:transparent;}
    .dark .frame-shell {background:#090A0F; color:#f8fafc;}
  </style>
  <script>
    (function(){const media=window.matchMedia('(prefers-color-scheme: dark)'); const saved='dark';document.documentElement.classList.toggle('dark',saved==='dark'||(saved!=='light'&&media.matches));})();
  </script>
</head>
<body>
  <div class="frame-shell">
    <header id="clc-header"></header>
    <iframe
      id="clcHymnFrame"
      class="frame-content"
      title="CLC 共用歌詞工具（YA 主站）"
      src="https://clc-ya-portal.pages.dev/hymn-lyrics?neutral=1"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <script>
      // 掛在 DX04 的 /sr/ 底下時，改用同網域的 /ya/ 歌詞頁；單獨開 SR 原網址時維持原本的 YA 網址。
      if (location.pathname.indexOf('/sr/') === 0) {
        document.getElementById('clcHymnFrame').src = '/ya/hymn-lyrics?neutral=1';
      }
    </script>
  </div>
  <script src="header.js?v=20261112-intakes"></script>
</body>
</html>
