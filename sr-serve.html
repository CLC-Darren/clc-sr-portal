.hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,#fbfaf3 18%,#fbfaf3 32%,transparent 64%) }
.kicker { color:var(--pine); font-weight:750; font-size:13px; letter-spacing:.13em; margin:0 0 10px }
h1 { color:var(--pine); font-size:clamp(31px,4.5vw,56px); letter-spacing:.035em; line-height:1.15; margin:0 0 12px }
.hero p:last-child { margin:0; color:var(--muted); font-weight:600 }
.panel { border:1px solid var(--line); border-radius:20px; background:#fff; overflow:hidden }
.toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; padding:15px 18px }
.tabs,.actions { display:flex; flex-wrap:wrap; gap:7px; align-items:center }
.tabs button,.actions button,.close { border:1px solid var(--line); border-radius:9px; background:white; padding:7px 12px; font-size:13px; font-weight:650 }
.tabs button[aria-pressed=true] { background:var(--pine); color:white; border-color:var(--pine) }
.help { margin:0; background:#f6faf6; border-block:1px solid var(--line); padding:9px 18px; font-size:13px; color:var(--muted) }
.scroller { max-height:64vh; min-height:230px; overflow:auto; overscroll-behavior:contain }
table { width:100%; min-width:1400px; border-spacing:0; table-layout:fixed; font-size:13px }
th,td { text-align:left; vertical-align:middle; padding:6px 8px; white-space:pre-wrap; overflow-wrap:anywhere }
thead { position:sticky; top:0; z-index:4 }
thead th,thead td { background:#e4f1e8; color:#24503e; font-weight:750; border-bottom:1px solid #ccdfd1 }
thead .people th,thead .people td { background:#f2f8f2; font-size:12px; color:var(--muted); font-weight:500 }
.corner,.row-head { width:42px; padding:0; text-align:center; position:sticky; left:0; z-index:2; background:#f0f5ed; font-size:11px; color:var(--muted) }
.row-head button { border:0; width:100%; min-height:32px; background:transparent; font:inherit }
.date { position:sticky; left:42px; z-index:1; background:#fbfcf8 }
thead .date,thead .corner { z-index:3 }
tbody tr { height:33px }
tbody:nth-of-type(even) td { background:#f9fbf7 }
tbody td.date { background:#f8faf3 }
tbody tr.week-start td,tbody tr.week-start th { border-top:1px solid #bccfc1; padding-top:9px; padding-bottom:9px }
tbody tr.week-start .date { color:var(--pine); font-weight:800; background:#e8f1e4 }
tbody td[data-tone=church] { background:#fcf0d3 }
tbody td[data-tone=guest] { background:#e2f3ee }
tbody td[data-tone=event] { background:#e7efd6 }
tbody td[data-tone=change] { background:#f8ebe4; color:#824834 }
td[data-col] { cursor:cell }
td[data-col]:focus { outline:none }
td[data-col].selected,.row-head.selected { background:#ccebe1!important }
td[data-col].active { box-shadow:inset 0 0 0 2px #27836c }
td textarea { display:block; width:100%; min-height:42px; font:inherit; resize:vertical }
.footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:9px; padding:12px 17px; border-top:1px solid var(--line); font-size:12px }
.legend { display:flex; flex-wrap:wrap; gap:10px; color:var(--muted) }
.legend span::before { content:""; width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; background:var(--dot) }
.footer a { color:var(--pine) }
.office-note { padding:0 17px 12px; margin:0; color:var(--muted); font-size:12px }
#status { margin:8px 4px 20px; min-height:24px; color:var(--muted); font-size:13px }
dialog { width:min(480px,calc(100% - 28px)); border:1px solid var(--line); border-radius:20px; padding:22px; color:var(--ink); box-shadow:0 16px 60px #173b3933 }
dialog::backdrop { background:#123a3070 }
dialog header { display:flex; justify-content:space-between; align-items:center; gap:10px }
dialog h2 { margin:0; font-size:21px }
dialog ul { padding-left:22px }
dialog li { margin-bottom:7px }

function quarterSchedule(year, firstMonth) {
  const date = new Date(Date.UTC(year,firstMonth-1,1));
  date.setUTCDate(date.getUTCDate() + (4-date.getUTCDay()+7)%7);

  return schedule;
}

function parseTSV(text) {
  const output = [['']];
  let quoted = false;
  let atStart = true;
  for (let index = 0; index < text.length; index++) {
    const row = output.at(-1);
    const char = text[index];
    if (char === '"' && quoted && text[index+1] === '"') {
      row[row.length-1] += '"';
      index++;
    } else if (char === '"' && (atStart || quoted)) {
      quoted = !quoted;
      atStart = false;
    } else if (!quoted && (char === '\t' || char === '\n' || char === '\r')) {
      if (char === '\t') row.push('');
      else {
        output.push(['']);
        if (char === '\r' && text[index+1] === '\n') index++;
      }
      atStart = true;
    } else {
      row[row.length-1] += char;
      atStart = false;
    }
  }
  if (output.length > 1 && atStart && output.at(-1).length === 1) output.pop();
  return output;
}

function encodeTSV(value) {
  return /[\t\r\n"]/.test(value) ? '"' + value.replaceAll('"','""') + '"' : value;
}

grid.addEventListener('pointerdown',event => {
  const td = event.target.closest('td[data-col]');
  if (!td || event.button !== 0 || event.target.closest('textarea')) return;
  if (event.pointerType === 'touch') return;
  event.preventDefault();
  move(point(td),event.shiftKey);
  dragging = true;
});
grid.addEventListener('pointerover',event => {
  const td = event.target.closest('td[data-col]');
  if (dragging && td) {
    extent = point(td);
    paint();
  }
});
window.addEventListener('pointerup',() => { dragging = false; });
window.addEventListener('pointercancel',() => { dragging = false; });

grid.addEventListener('click',event => {
  const button = event.target.closest('.row-head button');
  if (!button) {
    const td = event.target.closest('td[data-col]');
    if (td && !event.target.closest('textarea') && event.pointerType === 'touch') move(point(td));
    return;
  }
  anchor = {row:Number(button.dataset.row),col:0};
  extent = {...anchor,col:width-1};
  paint(true);
  show('已選取第 ' + (anchor.row+5) + ' 列。');
});

function edit(td) {
  if (isArchive()) return;
  if (td.querySelector('textarea')) return;
  const current = point(td);
  move(current);
  const input = document.createElement('textarea');
  input.value = data[current.row][current.col];
  input.setAttribute('aria-label', headings[current.col]);
  td.replaceChildren(input);
  let cancelled = false;
  input.addEventListener('blur',() => {
    td.textContent = data[current.row][current.col];
    if (!cancelled) apply([{...current,value:input.value}], '已更新預覽儲存格。');
  },{once:true});
  input.addEventListener('keydown',event => {
    if (event.isComposing || event.shiftKey || !['Escape','Enter'].includes(event.key)) return;
    event.preventDefault();
    event.stopPropagation();
    cancelled = event.key === 'Escape';
    input.blur();
    td.focus();
  });
  input.focus();
  input.select();
}

grid.addEventListener('dblclick',event => {
  const td = event.target.closest('td[data-col]');
  if (td) edit(td);
});
grid.addEventListener('focusin',event => {
  const td = event.target.closest('td[data-col]');
  if (td && !anchor) move(point(td));
});

grid.addEventListener('keydown',event => {
  if (!anchor || event.target.closest('textarea')) return;
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && !event.shiftKey) {
    event.preventDefault();
    undoLast();
    return;
  }
  const shifts = {ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
  if (shifts[event.key]) {
    event.preventDefault();
    const [dr,dc] = shifts[event.key];
    const from = event.shiftKey ? extent : anchor;
    const fromCell = cellAt(from.row,from.col);
    const fromBox = point(fromCell);
    const stepRow = dr > 0 ? fromBox.bottom : fromBox.row;
    const stepCol = dc > 0 ? fromBox.right : fromBox.col;
    const row = visibleRows[Math.max(0,Math.min(visibleRows.length-1,visibleRows.indexOf(dr ? stepRow : from.row)+dr))];
    const col = Math.max(0,Math.min(width-1,(dc ? stepCol : from.col)+dc));
    const target = cellAt(row,col);
    if (target === fromCell) return;
    move({...point(target),row,col},event.shiftKey);
    target.scrollIntoView({block:'nearest',inline:'nearest'});
  } else if (event.key === 'Enter' || event.key === 'F2') {
    event.preventDefault();
    edit(cellAt(anchor.row,anchor.col));
  }
});

grid.addEventListener('copy',event => {
  if (!anchor || event.target.closest('textarea') || !event.clipboardData) return;
  const [top,bottom,left,right] = bounds();
  const selection = visibleRows.filter(row => row >= top && row <= bottom);
  event.clipboardData.setData('text/plain',selection.map(row =>
    data[row].slice(left,right+1).map(encodeTSV).join('\t')
  ).join('\n'));
  event.preventDefault();
  show('已複製 ' + selection.length + ' 列、' + (right-left+1) + ' 欄。');
});

grid.addEventListener('paste',event => {
  if (!anchor || event.target.closest('textarea') || !event.clipboardData?.types.includes('text/plain')) return;
  event.preventDefault();
  if (isArchive()) { show('第四季原表供查閱。'); return; }
  const [top,,left] = bounds();
  const pasted = parseTSV(event.clipboardData.getData('text/plain'));
  const start = visibleRows.indexOf(top);
  const columns = pasted.reduce((max,row) => Math.max(max,row.length),0);
  if (start+pasted.length > visibleRows.length || left+columns > width) {
    show('貼上範圍超出目前顯示的表格，請改選起始格或切換到全季。');
    return;
  }
  if (visibleRows[start+pasted.length-1] !== top+pasted.length-1) {
    show('貼上範圍包含停聚週，請分段貼上。');
    return;
  }
  const changes = pasted.flatMap((values,offset) => values.map((value,index) =>
    ({row:visibleRows[start+offset],col:left+index,value})));
  apply(changes,'已貼上 ' + pasted.length + ' 列、' + columns + ' 欄。');
  anchor = {row:top,col:left};
  extent = {row:visibleRows[start+pasted.length-1],col:left+columns-1};
  paint(true);
});

monthTabs.addEventListener('click',event => {
  const button = event.target.closest('[data-month]');
  if (!button || button.dataset.month === month) return;
  month = button.dataset.month;
  monthTabs.querySelectorAll('button').forEach(tab => tab.setAttribute('aria-pressed',String(tab === button)));
  anchor = extent = null;
  render();
  scroller.scrollTo(0,0);
  show(month ? '顯示 ' + month + ' 月服事表。' : '顯示全季服事表。');
});
undo.addEventListener('click',undoLast);
reset.addEventListener('click',() => {
  source.forEach((row,index) => { data[index] = [...row]; });
  history.length = 0;
  render();
  syncButtons();
  show('已還原第四季原表。');
});
function selectQuarter(key) {
  if (quarter === key) return;
  quarter = key;
  source = quarterSources[key];
  data = quarterData[key];
  buildWeeks();
  month = '';
  anchor = extent = null;
  history.length = 0;
  syncButtons();
  document.querySelector('#quarter-select').value = key;
  const months = isArchive() ? [10,11,12] : [1,2,3];
  monthTabs.querySelectorAll('button').forEach((button,index) => {
    button.setAttribute('aria-pressed',String(index === 0));
    if (index) {
      button.dataset.month = months[index-1];
      button.textContent = months[index-1] + ' 月';
    }
  });
  const title = isArchive() ? '2026 年第四季' : '2027 年第一季';
  document.querySelector('#quarter-title').textContent = title;
  grid.setAttribute('aria-label',title + '加樂團契服事表');
  document.querySelector('#quarter-description').textContent = isArchive() ? '10–12 月 · 確認版' : '1–3 月 · 排班草稿';
  document.querySelector('#grid-help').textContent = isArchive()
    ? '第四季原表供查閱。點左側列號選整列，再按 Ctrl／⌘ + C 複製。'
    : '點列號選整列，或拖曳選取範圍。按 Ctrl／⌘ + C、V 複製貼上，雙擊可編輯。排班草稿保留在目前頁面。';
  document.querySelector('#office-note').hidden = !isArchive();
  render();
  scroller.scrollTo(0,0);
  show('顯示' + title + '服事表。');
}

document.querySelector('#quarter-select').addEventListener('change',event => selectQuarter(event.target.value));

const admin = document.querySelector('#admin');
const eventDate = document.querySelector('#event-date');
const eventKind = document.querySelector('#event-kind');
const eventText = document.querySelector('#event-text');
nextSchedule.forEach(({date}) => eventDate.add(new Option(date,date)));
function fillEvent() {
  const entry = eventFor(eventDate.value);
  eventKind.value = entry?.kind ?? '';
  eventText.value = entry?.text ?? '';
  eventText.disabled = !eventKind.value;
  eventText.required = Boolean(eventKind.value);
}
function storeEvents() {
  try {
    localStorage.setItem(eventKey,JSON.stringify(overrides));
    show('已在此瀏覽器儲存聚會設定。');
  } catch {
    show('聚會設定已套用至此頁，瀏覽器無法保存。');
  }
  if (!isArchive()) {
    anchor = extent = null;
    render();
  }
  admin.close();
}
eventDate.addEventListener('change',fillEvent);
eventKind.addEventListener('change',() => {
  eventText.disabled = !eventKind.value;
  eventText.required = Boolean(eventKind.value);
});
document.querySelector('#settings').addEventListener('click',() => {
  eventDate.value = '2027-02-04';
  fillEvent();
  admin.showModal();
});
document.querySelector('#event-form').addEventListener('submit',event => {
  event.preventDefault();
  if (eventKind.value && !eventText.value.trim()) {
    eventText.focus();
    return;
  }
  overrides[eventDate.value] = {kind:eventKind.value,text:eventKind.value ? eventText.value.trim() : ''};
  storeEvents();
});
document.querySelector('#event-default').addEventListener('click',() => {
  delete overrides[eventDate.value];
  storeEvents();
});
document.querySelector('#grid-help').textContent = '第四季原表供查閱。點左側列號可選整列，再按 Ctrl／⌘ + C 複製。';
buildWeeks();
render();
</script>
</html>
