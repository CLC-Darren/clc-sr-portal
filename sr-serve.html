<!DOCTYPE html>
<html lang="zh-TW" class="dark"><head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#090A0F">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 10-12月加樂團契服事表</title>
  <link rel="icon" href="images/sr-serve-favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/sr-serve-apple-touch-icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{extend:{colors:{brand:{teal:'#007E8A',tealHover:'#006C77',surface:'#11131B',card:'#161924',border:'rgba(255,255,255,0.1)',muted:'#8A92A6'}}}}
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    /* The SR header sits above a light roster, so use the solid YA dark surface here. */
    #clc-header { background-color:#090A0F; color:#f1f5f9 }
    :root {
      --bg-cream: #FCFDFB;
      --forest-green: #3D7A47;
      --forest-dark: #2C5E34;
      --sage-light: #EEF6EE;
      --sage-border: #C5DEC8;
      --marigold: #F4BD3E;
      --marigold-soft: #FEF5DC;
      --teal-sky: #8BC3CB;
      --teal-soft: #E6F4F6;
      --coral: #E67A3C;
      --grass-green: #7EB55C;
    }

    /* Global Thin Scrollbar (6px) */
    * {
      scrollbar-width: thin;
      scrollbar-color: #9BBF9F #EEF4EE;
    }
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: #EEF4EE;
    }
    *::-webkit-scrollbar-thumb {
      background: #9BBF9F;
      border-radius: 9999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: #3D7A47;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F9F5;
      color: #1E3323;
      margin: 0;
    }

    .font-brand-en {
      font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
      letter-spacing: 0.14em;
    }

    /* Compact 31px Row Height Spreadsheet Table Architecture */
    .roster-table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      width: 100%;
      min-width: 1230px;
    }

    .roster-table th {
      border: 1px solid #B8D1BA;
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
    }

    .roster-table td {
      border-left: 1px solid #DCE5DC;
      border-right: 1px solid #DCE5DC;
      border-top: none;
      border-bottom: none;
      box-sizing: border-box;
      overflow: hidden;
    }

    .roster-row {
      height: 31px;
      line-height: 31px;
    }

    /* Crisp dark full-width week separator (extends through 當週活動 rowspan="6") */
    .roster-table tr.week-divider td,
    .roster-table td.week-divider-cell {
      border-bottom: 1.5px solid #2A4D31 !important;
    }

    /* Distinct full-width DOUBLE divider line when month changes (extends through 當週活動 rowspan="6") */
    .roster-table tr.month-divider td,
    .roster-table td.month-divider-cell {
      border-bottom: 4px double #1E3323 !important;
    }

    /* Sticky Header & Sticky First Column (follows page scroll) */
    .sticky-header-top {
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .sticky-header-sub {
      position: sticky;
      top: var(--roster-first-row, 34px);
      z-index: 30;
    }
    .sticky-col-left {
      position: sticky;
      left: 0;
      z-index: 20;
      background-color: #FCFDFB;
      box-shadow: 4px 0 10px -2px rgba(61, 122, 71, 0.12);
    }
    .sticky-corner {
      position: sticky;
      left: 0;
      top: 0;
      z-index: 40;
      box-shadow: 4px 0 10px -2px rgba(44, 94, 52, 0.25);
    }

    /* Single-line Vertical Chinese Text for Lounge Labels */
    .vertical-zh-single {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.12em;
      white-space: nowrap;
      line-height: 1;
    }

    /* Harmonious Forest Green & Sage Selection Style (No clashing blue, no border on multi-cell range) */
    .gs-in-range {
      background-color: rgba(61, 122, 71, 0.15) !important;
      user-select: none;
    }
    .gs-selected-cell {
      position: relative;
      background-color: rgba(61, 122, 71, 0.12) !important;
      box-shadow: inset 0 0 0 2px #3D7A47 !important;
      z-index: 10;
    }
    .gs-range-corner::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      width: 6px;
      height: 6px;
      background-color: #3D7A47;
      border: 1px solid #FFFFFF;
      pointer-events: none;
      z-index: 15;
    }

    .editable-cell {
      outline: none;
      transition: background-color 0.08s ease;
    }
    .editable-cell:focus {
      background-color: #FFFFFF !important;
      box-shadow: inset 0 0 0 2px #3D7A47 !important;
    }

    @keyframes flashSage {
      0% { background-color: #FDE68A; }
      100% { background-color: transparent; }
    }
    .paste-flash {
      animation: flashSage 1.0s ease-out;
    }

    /* Modern iOS HIG & Android Material 3 Mobile/Tablet Portrait Switch (< 900px or portrait tablet) */
    @media (max-width: 899px), (max-width: 1024px) and (orientation: portrait) {
      #desktop-table-section {
        display: none !important;
      }
      #mobile-cards-section {
        display: block !important;
      }
    }
    @media (min-width: 900px) and (not ((max-width: 1024px) and (orientation: portrait))) {
      #desktop-table-section {
        display: block !important;
      }
      #mobile-cards-section {
        display: none !important;
      }
    }
    /* Desktop activity notes share one right-hand column for + and ×. */
    .desktop-event-stack { position:relative; top:var(--desktop-event-offset, 0px); padding-bottom:7px; }
    .desktop-event-row {
      display:grid;
      grid-template-columns:6px minmax(0,1fr) 16px;
      gap:3px;
      align-items:center;
      min-height:17px;
    }
    .desktop-event-text { min-width:0; overflow-wrap:anywhere; }
    .desktop-event-stack .desktop-event-action {
      width:16px;
      height:16px;
      margin:0;
      padding:0;
      text-align:center;
      line-height:16px;
    }
    .desktop-event-stack .desktop-event-add { position:absolute; right:0; top:-16px; }
    .desktop-event-row:focus-within .desktop-event-action { opacity:1; }
    #desktop-table-section { box-sizing:border-box;padding:8px 12px 12px }
    @media (min-width:640px) { #desktop-table-section { padding-inline:20px } }
    #roster-scroll {
      max-height:max(180px, calc(100dvh - var(--roster-top, 150px) - 12px));
      overflow:auto;border:1px solid #c5dec8;border-radius:9px;
      scrollbar-width:thin;scrollbar-color:#83a98a #edf4eb;
    }
    #roster-scroll:focus-visible { outline:2px solid #3d7a47;outline-offset:2px }
    .roster-table th,.roster-table td { border-left:0 }
    .roster-announcement { background:#f8edda;color:#603d21;font-weight:750 }
    .roster-announcement td { padding:7px 9px;line-height:1.35 }
    .roster-announcement .sticky-col-left { background:inherit }
    .roster-announcement.pause,.roster-announcement.pause .sticky-col-left { background:#fae5e4;color:#8a2626 }
    .roster-announcement.outing,.roster-announcement.outing .sticky-col-left { background:#e5f3e4;color:#285534 }
    .roster-announcement.special,.roster-announcement.special .sticky-col-left { background:#fbefd4 }
    .mobile-announcement { padding:12px 14px;border-radius:10px;font-size:18px }
    .roster-manager-panel { max-height:90dvh;overflow:auto;scrollbar-width:thin }
    #roster-settings-button[hidden],#roster-tbody button[hidden] { display:none!important }
    .roster-settings-block { padding:8px 0;border-top:1px solid #c5dec8 }
    .roster-settings-block summary { color:#2c5e34;font-weight:800;cursor:pointer }
    .roster-settings-block form { margin-top:8px }
    .roster-settings-block form[hidden] { display:none }
    .roster-settings-block label,#roster-search-form label { display:grid;gap:4px;font-weight:700;margin-bottom:8px }
    .roster-settings-block input,.roster-settings-block select,#roster-search-form input,#roster-search-form select {
      width:100%;min-width:0;min-height:42px;box-sizing:border-box;border:1px solid #a2bea6;
      border-radius:8px;background:#fff;color:#203a25;padding:6px 9px;color-scheme:light;
    }
    .roster-settings-block button,#roster-search button,.roster-search-button {
      border:1px solid #9bbd9f;border-radius:8px;background:#eaf4e9;color:#234d2c;
      padding:5px 10px;min-height:38px;font-weight:750;
    }
    #roster-calendar-list li { display:flex;gap:5px;margin-top:5px }
    #roster-calendar-list button:first-child { flex:1;text-align:left }
    #roster-calendar-error { color:#962c23 }
    .roster-settings-note { margin-top:6px;color:#526950 }
    #roster-search {
      display:none;margin:8px 12px 2px;border:1px solid #a9c7ad;border-radius:12px;
      background:#fcfdfb;color:#1e3323;padding:15px;font-size:18px;
    }
    #roster-search.desktop-open { display:block }
    @media(min-width:640px) { #roster-search { margin-inline:20px } }
    @media (max-width:899px), (max-width:1024px) and (orientation:portrait) {
      #roster-search { display:block }
      #roster-search-toggle { display:none }
    }
    #roster-name-suggestions:empty { display:none }
    #roster-name-suggestions { display:grid;gap:3px;margin:-3px 0 10px }
    #roster-name-suggestions button { display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left }
    #roster-name-suggestions small { color:#375e40;font-size:13px }
    #roster-name-suggestions [aria-selected="true"] { background:#d0e8d3;outline:2px solid #3d7a47 }
    .roster-search-hint { font-size:14px;color:#45624a;line-height:1.4;margin:-3px 0 8px }
    .roster-search-header { display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:12px }
    .roster-search-header h2 { font-size:23px;font-weight:850 }
    .roster-search-header p { font-size:14px }
    .roster-search-dates { display:grid;grid-template-columns:1fr 1fr;gap:8px }
    #roster-search-results { margin-top:12px }
    #roster-search-results section { margin-top:8px;padding:8px 0;border-top:1px solid #d4e4d6 }
    #roster-search-results h3,#roster-search-results h4 { font-weight:850 }
    .roster-search-choices { display:flex;flex-wrap:wrap;gap:7px;margin-top:8px }
    @media(max-width:480px) { #roster-search { padding:12px } }
  </style>

<body class="min-h-screen flex flex-col">

  <!-- ===================================================================== -->
  <!-- TOP HEADER & QUARTER / MONTH NAVIGATION BAR                           -->
  <!-- ===================================================================== -->
  <header id="clc-header"></header>
  <header class="bg-[#FCFDFB] border-b border-[#C5DEC8] px-3 sm:px-5 py-2.5">
    <div class="max-w-full mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Left: Big Year + Title + Version Status Badge -->
      <div class="flex items-baseline gap-2.5 flex-wrap">
        <span id="header-year-display" class="text-3xl sm:text-4xl font-black text-[#3D7A47] tracking-tight leading-none">2026</span>
        <h1 id="header-title-display" class="text-lg sm:text-2xl font-black text-[#1E3323] tracking-tight">
          10-12月加樂團契服事表
        </h1>
        <span id="version-status-badge" class="px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black bg-[#EEF6EE] text-[#2C5E34] border border-[#3D7A47]/40">
          確認版
        </span>
      </div>

      <!-- Right: Color Legend + Remark + Super User Gear Button -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap ml-auto">
        <div class="flex items-center gap-1.5 text-[11px] sm:text-xs font-bold">
          <span class="px-2 py-0.5 rounded bg-[#E53E3E] text-white">調整異動</span>
          <span class="px-2 py-0.5 rounded bg-[#BBF7D0] text-[#1E3323] border border-[#7EB55C]">加樂出遊</span>
          <span class="px-2 py-0.5 rounded bg-[#FDE68A] text-[#1E3323] border border-[#F4BD3E]">教會講員</span>
          <span class="px-2 py-0.5 rounded bg-[#BAE6FD] text-[#1E3323] border border-[#8BC3CB]">其他講員</span>
        </div>

        <span id="header-remark-text" class="text-xs font-bold text-[#4A6650]">
          *師母講道時間確認後要 email 通知心怡。
        </span>

        <!-- Super User Settings Gear Button -->
        <button id="roster-settings-button" hidden type="button" onclick="toggleSuperUserModal(true)" title="管理設定"
          class="w-9 h-9 rounded-full bg-[#EEF6EE] hover:bg-[#3D7A47] text-[#2C5E34] hover:text-white border border-[#C5DEC8] flex items-center justify-center transition-colors shadow-2xs shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Year / Quarter & Month Selector Strip -->
    <div class="max-w-full mx-auto mt-2 pt-2 border-t border-[#E3EDE4] flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap items-center gap-2">
        <div class="relative inline-flex items-center">
          <select id="quarter-selector" onchange="switchQuarter(this.value)"
            class="appearance-none bg-[#EEF6EE] hover:bg-[#dcecdc] text-[#2C5E34] font-black text-xs sm:text-sm rounded-xl pl-3.5 pr-8 py-1.5 border border-[#C5DEC8] focus:outline-none focus:ring-2 focus:ring-[#3D7A47]/30 cursor-pointer">
            <option value="2026-Q4">2026 年 第4季 (10-12月)</option>
            <option value="2027-Q1">2027 年 第1季 (1-3月・空白排班)</option>
          </select>
          <svg class="w-4 h-4 text-[#2C5E34] absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>

        <div id="month-filter-tabs" class="inline-flex items-center bg-[#F4F8F4] p-1 rounded-xl border border-[#C5DEC8] gap-1">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <button type="button" id="roster-search-toggle" class="roster-search-button" onclick="openRosterSearch()" aria-controls="roster-search" aria-expanded="false">搜尋</button>
      <div id="week-count-badge" class="text-xs font-bold text-[#6C8570]">
        共 14 週聚會
      </div>
    </div>
  </header>

  <section id="roster-search" aria-labelledby="roster-search-title">
    <header class="roster-search-header">
      <div><h2 id="roster-search-title">搜尋服事</h2><p id="roster-search-quarter"></p></div>
    </header>
    <form id="roster-search-form">

    document.getElementById('roster-leader-settings').addEventListener('submit', event => {

    const searchPanel = document.getElementById('roster-search');
    const searchForm = document.getElementById('roster-search-form');
    const searchResults = document.getElementById('roster-search-results');
    const searchRoles = searchForm.elements.role;
    const searchName = searchForm.elements.member;
    const suggestions = document.getElementById('roster-name-suggestions');
    Object.entries(SEARCH_ROLES).forEach(([value,text]) => searchRoles.add(new Option(text,value)));
    const nameSoundCache = new Map();
    const SEARCH_VARIANTS = { 臺:'台',裏:'裡',峯:'峰',綫:'線',爲:'為' };
    const MATCH_LABELS = ['完全符合','開頭符合','文字包含','同音','近音','相關字'];
    let activeSuggestion = -1;
    let selectedSearchName = '';
    let endDateEdited = false;

    function nameKey(value) {
      return value.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')
        .replace(/[臺裏峯綫爲]/g,char => SEARCH_VARIANTS[char]);
    }
    function nameSounds(value) {
      if (!window.pinyinPro) return [];
      if (nameSoundCache.has(value)) return nameSoundCache.get(value);
      const sounds = window.pinyinPro.pinyin(value,{toneType:'none',type:'array',nonZh:'consecutive'});
      nameSoundCache.set(value,sounds);
      return sounds;
    }
    function nearSound(value) {
      return value.replace(/^([zcs])h/,'$1').replace(/^l/,'n').replace(/^fu/,'hu')
        .replace(/ing$/,'in').replace(/eng$/,'en');
    }
    function syllableContains(query, name) {
      return query.length >= 2 && name.some((_,index) => query.every((syllable,offset) => name[index+offset] === syllable));
    }
    function differsOnce(a,b) {
      if (Math.abs(a.length-b.length) > 1) return false;
      if (a.length > b.length) return differsOnce(b,a);
      let i = 0;
      while (i < a.length && a[i] === b[i]) i++;
      return a.slice(i+(a.length === b.length ? 1 : 0)).join('') === b.slice(i+1).join('');
    }
    function nameScore(term, name) {
      const query = nameKey(term), known = nameKey(name);
      if (!query) return Infinity;
      if (known === query) return 0;
      if (known.startsWith(query)) return 1;
      if (known.includes(query)) return 2;
      if (query.length < 2) return Infinity;
      const left = nameSounds(query), right = nameSounds(known);
      if (syllableContains(left,right)) return 3;
      if (syllableContains(left.map(nearSound),right.map(nearSound))) return 4;
      const queryChars = [...new Set(query)];
      const shared = queryChars.filter(char => known.includes(char)).length;
      if ((query.length >= 3 && differsOnce([...query],[...known])) ||
          (queryChars.length >= 2 && known.length >= 3 && shared >= 2 && shared/queryChars.length >= 2/3)) return 5;
      return Infinity;
    }

    function assignments() {
      return quarter().weeks.flatMap(week => {
        const date = isoWeek(week);
        if (!date || weekOverride(week)) return [];
        const rows = Object.keys(SEARCH_ROLES).filter(role => role !== 'speaker').flatMap(role => (week[role] || []).flatMap(value => {
          const name = value.trim();
          return !name || /^[（(]/.test(name) || ['讚美操','健康操'].includes(name) ? [] : [{date,role,name}];
        }));
        const speaker = week.speaker.trim();
        const name = speaker.replace(/\s*(牧師|師母|傳道|弟兄|姊妹|姐妹|長老|執事|老師)\s*$/,'').trim();
        if (name && week.speakerType !== 'outing' && !/(佈道|活動|休會|出遊)$/.test(name)) {
          rows.push({date,role:'speaker',name,displayName:speaker});
        }
        return rows;
      });
    }
    function renderSearch(name, entries) {
      searchResults.replaceChildren();
      if (!entries.length) {
        searchResults.textContent = '這個範圍內沒有符合的服事。';
        return;
      }
      if (name) {
        const heading = document.createElement('h3');
        heading.textContent = name+'的服事';
        searchResults.append(heading);
      }
      const groups = new Map();
      for (const entry of entries) {
        if (!groups.has(entry.date)) groups.set(entry.date,new Map());
        const roles = groups.get(entry.date);
        if (!roles.has(entry.role)) roles.set(entry.role,new Set());
        roles.get(entry.role).add(entry.displayName || entry.name);
      }
      for (const [date,roles] of [...groups].sort(([a],[b]) => a.localeCompare(b))) {
        const section = document.createElement('section');
        const headline = document.createElement('h4');
        headline.textContent = displayDate(date);
        const list = document.createElement('ul');
        for (const [role,names] of roles) {
          const li = document.createElement('li');
          li.textContent = SEARCH_ROLES[role]+(name && role !== 'speaker' ? '' : '　'+[...names].join('、'));
          list.append(li);
        }
        section.append(headline,list);
        searchResults.append(section);
      }
    }

    function candidatesFor(term) {
      const names = new Map();
      for (const {name,displayName} of assignments()) {
        if (!names.has(name)) names.set(name,new Set([name]));
        if (displayName) names.get(name).add(displayName);
      }
      return [...names].map(([name,aliases]) => ({
        name,score:Math.min(...[...aliases].map(alias => nameScore(term,alias)))
      })).filter(item => Number.isFinite(item.score))
        .sort((a,b) => a.score-b.score || a.name.localeCompare(b.name,'zh-Hant'));
    }
    function clearSuggestions() {
      activeSuggestion = -1;
      suggestions.replaceChildren();
      searchName.setAttribute('aria-expanded','false');
      searchName.removeAttribute('aria-activedescendant');
    }
    function renderSuggestions(choices) {
      clearSuggestions();
      for (const [index,{name,score}] of choices.slice(0,8).entries()) {
        const button = document.createElement('button');
        const reason = document.createElement('small');
        button.type = 'button';
        button.tabIndex = -1;
        button.id = 'roster-name-option-'+index;
        button.setAttribute('role','option');
        button.setAttribute('aria-selected','false');
        reason.textContent = MATCH_LABELS[score];
        button.append(name,reason);
        button.onclick = () => {
          selectedSearchName = name;
          searchName.value = name;
          clearSuggestions();
          runRosterSearch();
          searchName.focus({preventScroll:true});
        };
        suggestions.append(button);
      }
      searchName.setAttribute('aria-expanded',String(choices.length > 0));
    }
    function runRosterSearch() {
      const term = searchName.value.trim();
      const role = searchRoles.value;
      const from = searchForm.elements.from.value, to = searchForm.elements.to.value;
      if (from && to && from > to) {
        searchResults.textContent = '開始日期需早於或等於結束日期。';
        return;
      }
      const data = assignments().filter(item => (!role || item.role === role) &&
        (!from || item.date >= from) && (!to || item.date <= to));
      if (!term) { clearSuggestions(); renderSearch('',data); return; }
      const choices = candidatesFor(term);
      const exact = choices.filter(choice => choice.score === 0);
      const picked = selectedSearchName === term ? term : exact.length === 1 ? exact[0].name : choices.length === 1 ? choices[0].name : '';
      if (picked) {
        clearSuggestions();
        renderSearch(picked,data.filter(item => item.name === picked));
      } else if (!choices.length) {
        clearSuggestions();
        renderSearch('',[]);
      } else {
        renderSuggestions(choices);
        searchResults.textContent = '請先從上方提示選擇姓名。';
      }
    }
    function quarterSearchBounds() {
      const months = quarter().months;
      const year = Number(quarter().year);
      return [new Date(Date.UTC(year,months[0]-1,1)).toISOString().slice(0,10),
        new Date(Date.UTC(year,months.at(-1),0)).toISOString().slice(0,10)];
    }
    function resetRosterSearch() {
      clearSuggestions();
      searchResults.replaceChildren();
      searchForm.reset();
      selectedSearchName = '';
      endDateEdited = false;
      const [first,last] = quarterSearchBounds();
      const now = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
      for (const date of [searchForm.elements.from,searchForm.elements.to]) {
        date.min = first;
        date.max = last;
      }
      searchForm.elements.from.value = now >= first && now <= last ? now : first;
      searchForm.elements.to.value = last;
      document.getElementById('roster-search-quarter').textContent = quarter().year+' 年 '+quarter().title;
    }
    function openRosterSearch() {
      searchPanel.classList.toggle('desktop-open');
      const opened = searchPanel.classList.contains('desktop-open');
      document.getElementById('roster-search-toggle').setAttribute('aria-expanded',String(opened));
      if (opened) searchName.focus({preventScroll:true});
      resizeRosterViewport();
    }
    function refreshSuggestions(event) {
      if (event.isComposing) return;
      selectedSearchName = '';
      renderSuggestions(candidatesFor(searchName.value));
      resizeRosterViewport();
    }
    searchName.addEventListener('input',refreshSuggestions);
    searchName.addEventListener('compositionend',refreshSuggestions);
    searchName.addEventListener('keydown',event => {
      if (event.isComposing || !suggestions.children.length) return;
      const count = suggestions.children.length;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const step = event.key === 'ArrowDown' ? 1 : -1;
        activeSuggestion = activeSuggestion < 0 && step < 0 ? count-1 : (activeSuggestion+step+count)%count;
        [...suggestions.children].forEach((button,index) => button.setAttribute('aria-selected',String(index === activeSuggestion)));
        searchName.setAttribute('aria-activedescendant',suggestions.children[activeSuggestion].id);
      } else if (event.key === 'Escape') {
        clearSuggestions();
      } else if (event.key === 'Enter' && activeSuggestion >= 0) {
        event.preventDefault();
        suggestions.children[activeSuggestion].click();
      }
    });
    searchForm.elements.to.addEventListener('change',() => { endDateEdited = Boolean(searchForm.elements.to.value); });
    searchForm.elements.from.addEventListener('change',() => {
      if (!endDateEdited) searchForm.elements.to.value = quarterSearchBounds()[1];
    });
    searchForm.addEventListener('submit',event => { event.preventDefault(); runRosterSearch(); resizeRosterViewport(); });

    // =========================================================================
    // 2. QUARTER & MONTH NAVIGATION LOGIC

    // =========================================================================
    // 3. RENDER COMPACT DESKTOP SPREADSHEET TABLE
    // =========================================================================
    let desktopEventObserver;

    function alignDesktopEvents(weeks) {
      for (const {activityCell, lastSongCell} of weeks) {
        if (!lastSongCell.getClientRects().length) continue;
        const stack = activityCell.querySelector('.desktop-event-stack');
        const anchor = stack.querySelector('.desktop-event-row:last-child') ||
          stack.querySelector('.desktop-event-add');
        const song = lastSongCell.getBoundingClientRect();
        const note = anchor.getBoundingClientRect();
        const previous = parseFloat(stack.style.getPropertyValue('--desktop-event-offset')) || 0;
        const offset = previous + (song.top + song.height/2) - (note.top + note.height/2);
        if (Math.abs(offset-previous) > 0.25) {
          stack.style.setProperty('--desktop-event-offset', offset+'px');
        }
      }
    }

                </div>

            }).join('');

            tdActivity.innerHTML = `

                  <!-- Line 1: Month & Day -->

                      <button type="button" ${canManageRoster() ? '' : 'hidden'} onclick="cycleSpeakerType(${realIdx})"

                        ↻
                      </button>
                    </div>
                  </div>

                  <!-- Line 3: Topic -->
                  <div contenteditable="${canManageRoster()}"
                    onblur="updateActivityField(${realIdx}, 'topic', this.innerText)"

                    +

          }

          const globalRow = displayIdx * 6 + r;

          if (r < 3) {

            });
          } else {
            const songConfigs = {
              3: { key: 'fast', label: '快歌', badgeCls: 'bg-[#FEF5DC] text-[#9A6700] border-[#F4BD3E]', placeholder: '輸入快歌...' },
              4: { key: 'slow1', label: '慢歌', badgeCls: 'bg-[#E6F4F6] text-[#1E5B70] border-[#8BC3CB]', placeholder: '輸入慢歌一...' },
              5: { key: 'slow2', label: '慢歌', badgeCls: 'bg-[#E6F4F6] text-[#1E5B70] border-[#8BC3CB]', placeholder: '輸入慢歌二...' }

    function createNameCell(weekIdx, colKey, rowIdx, value, globalRow, gridCol) {
      const weeks = quarterStore[currentQuarterKey].weeks;
      const td = document.createElement('td');
      const isChanged = weeks[weekIdx].changedCells[`${colKey}:${rowIdx}`];
      const isPraiseExerciseNote = colKey === 'exercise' && (value === '讚美操' || value === '健康操');

      td.dataset.weekIdx = weekIdx;
      td.dataset.colKey = colKey;
      td.dataset.rowIdx = rowIdx;
      td.dataset.globalRow = globalRow;
      td.dataset.gridCol = gridCol;
      td.contentEditable = 'true';
      td.textContent = value;

      td.className = `editable-cell px-0.5 h-[31px] leading-[31px] text-center text-[16px] font-bold tracking-normal whitespace-nowrap ${
        isChanged
          ? 'bg-[#E53E3E] text-white font-black'
          : isPraiseExerciseNote
            ? 'text-[#C83E6B] font-bold'
            : 'text-[#1E3323]'
      }`;

      attachGridCellEvents(td, globalRow, gridCol, true);

      td.onblur = () => {
        const cleaned = td.textContent.trim();
        weeks[weekIdx][colKey][rowIdx] = cleaned;
        renderMobileCards();
      };

      td.onpaste = (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text');
        if (text && (text.includes('\n') || text.includes('\t'))) {
          e.preventDefault();
          applyRectangularPaste(text);
        }
      };

      return td;
    }

    // =========================================================================
    // 4. GOOGLE SHEETS RECTANGULAR MULTI-CELL SELECTION, CTRL+C & CTRL+V
    // =========================================================================
    function attachGridCellEvents(td, globalRow, gridCol, isEditableName) {
      td.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        // Double-click enters inline text editing mode for that single cell
        if (e.detail >= 2 && isEditableName) return;

        // Prevent native browser blue text highlight on grid selection
        e.preventDefault();
        const winSel = window.getSelection();
        if (winSel) winSel.removeAllRanges();
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }

        if (e.shiftKey) {
          selectionRange.endR = globalRow;
          selectionRange.endC = gridCol;
          updateSelectionVisuals();
          return;
        }

        // Start a fresh rectangular selection
        selectionRange = { startR: globalRow, startC: gridCol, endR: globalRow, endC: gridCol };
        isDraggingSelection = true;
        updateSelectionVisuals();
      });

      td.addEventListener('mouseenter', () => {
        if (!isDraggingSelection) return;
        selectionRange.endR = globalRow;
        selectionRange.endC = gridCol;
        updateSelectionVisuals();
      });
    }

    document.addEventListener('mouseup', () => {
      if (isDraggingSelection) {
        isDraggingSelection = false;
      }
    });

    function getNormalizedRange() {
      return {
        minR: Math.min(selectionRange.startR, selectionRange.endR),
        maxR: Math.max(selectionRange.startR, selectionRange.endR),
        minC: Math.min(selectionRange.startC, selectionRange.endC),
        maxC: Math.max(selectionRange.startC, selectionRange.endC)
      };
    }

    function updateSelectionVisuals() {
      const { minR, maxR, minC, maxC } = getNormalizedRange();
      const isSingleCell = minR === maxR && minC === maxC;

      document.querySelectorAll('#roster-tbody td').forEach(td => {
        td.classList.remove(
          'gs-in-range',
          'gs-selected-cell',
          'gs-range-corner'
        );

        let rStart, rEnd, cStart, cEnd;
        if (td.dataset.globalRow !== undefined && td.dataset.gridCol !== undefined) {
          rStart = rEnd = Number(td.dataset.globalRow);
          cStart = cEnd = Number(td.dataset.gridCol);
        } else if (td.dataset.globalRowStart !== undefined && td.dataset.gridCol !== undefined) {
          rStart = Number(td.dataset.globalRowStart);
          rEnd = Number(td.dataset.globalRowEnd);
          cStart = cEnd = Number(td.dataset.gridCol);
        } else if (td.dataset.globalRow !== undefined && td.dataset.gridColStart !== undefined) {
          rStart = rEnd = Number(td.dataset.globalRow);
          cStart = Number(td.dataset.gridColStart);
          cEnd = Number(td.dataset.gridColEnd);
        } else {
          return;
        }

        const intersects = !(rEnd < minR || rStart > maxR || cEnd < minC || cStart > maxC);
        if (!intersects) return;

        if (isSingleCell && rStart === minR && rEnd === maxR && cStart === minC && cEnd === maxC) {
          // Single cell: clean 2px Forest Green border + corner handle
          td.classList.add('gs-selected-cell', 'gs-range-corner');
        } else {
          // Multi-cell range: pure soft sage background only, NO outer border lines
          td.classList.add('gs-in-range');
        }
      });
    }

    // Resolve a (globalRow, gridCol) coordinate to an editable cell or null if fixed/skipped
    function resolveGridCoordinate(globalRow, gridCol) {
      const colSpec = GRID_COLS[gridCol];
      if (!colSpec || colSpec.type !== 'editable') return null;

      const visibleItems = rosterSchedule().filter(item => !item.announcement);
      const displayIdx = Math.floor(globalRow / 6);
      const rowInWeek = globalRow % 6;
      if (displayIdx < 0 || displayIdx >= visibleItems.length) return null;
      if (rowInWeek >= colSpec.maxRow) return null; // Skip song rows under worship/musician/slides/sound

      return {
        weekIdx: visibleItems[displayIdx].realIdx,
        colKey: colSpec.key,
        rowIdx: rowInWeek
      };
    }

    function buildSelectedRangeTsv() {
      const { minR, maxR, minC, maxC } = getNormalizedRange();
      const weeks = quarterStore[currentQuarterKey].weeks;
      const tsvRows = [];

      for (let r = minR; r <= maxR; r++) {
        const rowVals = [];
        for (let c = minC; c <= maxC; c++) {
          const target = resolveGridCoordinate(r, c);
          if (!target) {
            rowVals.push('');
          } else {
            rowVals.push(weeks[target.weekIdx][target.colKey][target.rowIdx] || '');
          }
        }
        tsvRows.push(rowVals.join('\t'));
      }
      return {
        tsvText: tsvRows.join('\n'),
        rowCount: maxR - minR + 1,
        colCount: maxC - minC + 1
      };
    }

    function copyTextFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (err) {}
      document.body.removeChild(ta);
    }

    // Standard Ctrl+C / Cmd+C for rectangular selection (copies full selected rectangle)
    document.addEventListener('copy', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      // Only defer to native copy if user double-clicked into a cell and highlighted specific text
      const winSel = window.getSelection();
      if (winSel && winSel.toString().length > 0 && document.activeElement && document.activeElement.isContentEditable) {
        return;
      }

      const { tsvText, rowCount, colCount } = buildSelectedRangeTsv();
      e.preventDefault();
      if (e.clipboardData) {
        e.clipboardData.setData('text/plain', tsvText);
      } else {
        copyTextFallback(tsvText);
      }
      showToast(`已複製 ${rowCount} 列 × ${colCount} 欄矩形資料`);
    });

    // Ensure Ctrl+C / Cmd+C always triggers even when no text selection exists in the document
    document.addEventListener('keydown', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (document.activeElement && document.activeElement.isContentEditable) return;

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        const { tsvText, rowCount, colCount } = buildSelectedRangeTsv();
        copyTextFallback(tsvText);
        showToast(`已複製 ${rowCount} 列 × ${colCount} 欄矩形資料`);
        return;
      }

      if (e.key === 'Delete' || e.key === 'Backspace') {
        const { minR, maxR, minC, maxC } = getNormalizedRange();
        const weeks = quarterStore[currentQuarterKey].weeks;
        let cleared = 0;

        for (let r = minR; r <= maxR; r++) {
          for (let c = minC; c <= maxC; c++) {
            const target = resolveGridCoordinate(r, c);
            if (!target) continue;
            weeks[target.weekIdx][target.colKey][target.rowIdx] = '';
            cleared++;
          }
        }
        if (cleared > 0) {
          e.preventDefault();
          renderDesktopTable();
          renderMobileCards();
          showToast(`已清除選取範圍內 ${cleared} 格姓名`);
        }
      }
    });

    // Multi-row & multi-column rectangular paste (automatically skips fixed columns & song rows)
    function applyRectangularPaste(rawText) {
      const cleanText = rawText.replace(/\r\n/g, '\n').replace(/\n$/, '');
      if (!cleanText) return;

      const matrix = cleanText.split('\n').map(row => row.split('\t'));
      const { minR, minC } = getNormalizedRange();
      const weeks = quarterStore[currentQuarterKey].weeks;
      const flashedCoords = [];
      let pastedCount = 0;

      for (let rOff = 0; rOff < matrix.length; rOff++) {
        for (let cOff = 0; cOff < matrix[rOff].length; cOff++) {
          const targetR = minR + rOff;
          const targetC = minC + cOff;
          const target = resolveGridCoordinate(targetR, targetC);
          if (!target) continue; // Automatically skip fixed labels & song rows

          const val = (matrix[rOff][cOff] || '').trim();
          weeks[target.weekIdx][target.colKey][target.rowIdx] = val;
          flashedCoords.push(target);
          pastedCount++;
        }
      }

      if (pastedCount > 0) {
        selectionRange = {
          startR: minR,
          startC: minC,
          endR: minR + matrix.length - 1,
          endC: minC + Math.max(...matrix.map(r => r.length)) - 1
        };
        renderDesktopTable();
        renderMobileCards();

        flashedCoords.forEach(t => {
          const cell = document.querySelector(
            `td[data-week-idx="${t.weekIdx}"][data-col-key="${t.colKey}"][data-row-idx="${t.rowIdx}"]`
          );
          if (cell) cell.classList.add('paste-flash');
        });
        showToast(`已貼上 ${pastedCount} 格資料（自動跳過固定欄位）`);
      }
    }

    document.addEventListener('paste', (e) => {
      const desktopSection = document.getElementById('desktop-table-section');
      if (!desktopSection || desktopSection.offsetParent === null) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (document.activeElement && document.activeElement.isContentEditable) return;

      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (text) {
        e.preventDefault();
        applyRectangularPaste(text);
      }
    });

        btnConfirmed.className = 'py-2.5 px-3 rounded-xl font-black border-2 border-[#3D7A47] bg-[#3D7A47] text-white transition-all';
        btnDraft.className = 'py-2.5 px-3 rounded-xl font-black border-2 border-[#C5DEC8] bg-white text-[#2C5E34] hover:bg-[#EEF6EE] transition-all';

    function updateHeaderRemark(val) {
      document.getElementById('header-remark-text').textContent = val;
    }

    function downloadSelfHtml() {
      const clonedDoc = document.documentElement.cloneNode(true);
      const modal = clonedDoc.querySelector('#superuser-modal');
      if (modal) modal.classList.add('hidden');

      const scriptEl = clonedDoc.querySelector('#roster-seed-script');
      if (scriptEl) {
        let code = scriptEl.textContent;
        const exported = Object.fromEntries(Object.entries(quarterStore).map(([key,value]) => [
          key,{...value,...(localRosterSettings[key] || {})}
        ]));
        code = code.replace(
          /const INITIAL_QUARTER_STORE = \{[\s\S]*?\n    \};/,
          () => `const INITIAL_QUARTER_STORE = ${JSON.stringify(exported, null, 6).replace(/</g, '\\u003c')};`
        );
        code = code.replace(
          /let currentQuarterKey = '.*?';/,
          `let currentQuarterKey = '${currentQuarterKey}';`
        );
        code = code.replace(
          /let versionStatus = '.*?';/,
          `let versionStatus = '${versionStatus}';`
        );
        scriptEl.textContent = code;
      }

      const q = quarterStore[currentQuarterKey];
      const fullHtml = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${q.year}_${q.title}_${versionStatus}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`已下載「${q.year}_${q.title}_${versionStatus}.html」`);
    }

    // =========================================================================
    // 6. INTERACTIVE FIELD EDITING HELPERS
    // =========================================================================
    function cycleSpeakerType(weekIdx) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      const order = ['church', 'external', 'outing'];
      const curr = weeks[weekIdx].speakerType || 'church';
      const next = order[(order.indexOf(curr) + 1) % order.length];
      weeks[weekIdx].speakerType = next;
      renderDesktopTable();
      renderMobileCards();
      showToast(`已切換講員分類為「${SPEAKER_STYLES[next].label}」`);
    }

    function updateTagArray(weekIdx, arrayKey, rowIdx, rawText) {
      const weeks = quarterStore[currentQuarterKey].weeks;
      weeks[weekIdx][arrayKey][rowIdx] = rawText.replace(/\s+/g, ' ').trim();
      renderDesktopTable();
      renderMobileCards();
    }

    function updateActivityField(weekIdx, field, val) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      const cleaned = val.trim();
      weeks[weekIdx][field] = cleaned === '輸入講員' ? '' : cleaned;
      renderMobileCards();
    }

    function updateSongField(weekIdx, songKey, val) {
      const weeks = quarterStore[currentQuarterKey].weeks;
      weeks[weekIdx].songs[songKey] = val.trim();
      renderMobileCards();
    }

    // Bottom-up special event stack helpers (first item at bottom, '+' stacks upward)
    function addEventItemUpward(weekIdx) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      if (!Array.isArray(weeks[weekIdx].events)) {
        weeks[weekIdx].events = [];
      }
      // Prepend so the first existing item stays at the very bottom and new items stack upward
      weeks[weekIdx].events.unshift({ text: '新活動項目', color: 'red' });
      renderDesktopTable();
      renderMobileCards();
    }

    function updateEventItem(weekIdx, evIdx, val) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      const cleaned = val.trim();
      if (!cleaned) {
        weeks[weekIdx].events.splice(evIdx, 1);
        renderDesktopTable();
      } else {
        weeks[weekIdx].events[evIdx].text = cleaned;
      }
      renderMobileCards();
    }

    function cycleEventColor(weekIdx, evIdx) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      const curr = weeks[weekIdx].events[evIdx].color || 'red';
      const next = EVENT_COLOR_KEYS[(EVENT_COLOR_KEYS.indexOf(curr) + 1) % EVENT_COLOR_KEYS.length];
      weeks[weekIdx].events[evIdx].color = next;
      renderDesktopTable();
      renderMobileCards();
    }

    function removeEventItem(weekIdx, evIdx) {
      if (!canManageRoster()) return;
      const weeks = quarterStore[currentQuarterKey].weeks;
      weeks[weekIdx].events.splice(evIdx, 1);
      renderDesktopTable();
      renderMobileCards();
    }

    // =========================================================================
    // 7. RENDER MODERN iOS HIG / MATERIAL DESIGN 3 MOBILE ELDER CARDS (>= 16PX)
    // =========================================================================
    function renderMobileCards() {
      const container = document.getElementById('mobile-cards-list');
      if (!container) return;
      container.innerHTML = '';

      const visibleItems = rosterSchedule();
      visibleItems.forEach((item, displayIdx) => {
        if (item.announcement) {
          container.append(renderMobileAnnouncement(item));
          return;
        }
        const {week} = item;
        const prevItem = visibleItems[displayIdx - 1];
        if (prevItem && prevItem.month !== week.month) {
          const divider = document.createElement('div');
          divider.className = 'pt-3 pb-1';
          divider.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="h-[2px] flex-1 bg-[#3D7A47]/30"></div>
              <span class="text-[17px] font-black text-[#2C5E34] bg-white px-4 py-1.5 rounded-full border-2 border-[#3D7A47] shadow-2xs">
                📅 ${week.month} 月份服事
              </span>
              <div class="h-[2px] flex-1 bg-[#3D7A47]/30"></div>
            </div>
          `;
          container.appendChild(divider);
        }

        const roleDefs = [
          { key: 'worship', label: '敬拜', icon: '🎤' },
          { key: 'musician', label: '樂手', icon: '🎹' },
          { key: 'slides', label: '投影片', icon: '🖥️' },
          { key: 'sound', label: '音控', icon: '🎚️' },
          { key: 'photo', label: '攝影', icon: '📷' },
          { key: 'usher', label: '招待', icon: '🤝', tagKey: 'usherTags' },
          { key: 'meal', label: '愛宴', icon: '🍱' },
          { key: 'shuttle', label: '接送', icon: '🚐', tagKey: 'shuttleCars' },
          { key: 'rollcall', label: '點名', icon: '📋' },
          { key: 'loungeReception', label: '交誼廳接待', icon: '☕' },
          { key: 'loungeBP', label: '量血壓', icon: '🩺' },
          { key: 'exercise', label: '體操', icon: '🤸' },
          { key: 'duty', label: '值班', icon: '🔔' }
        ];

        const roleBlocks = [];

        roleDefs.forEach(def => {
          const names = week[def.key] || [];
          const tags = def.tagKey ? (week[def.tagKey] || []) : [];
          const items = [];

          names.forEach((rawName, idx) => {
            const name = (rawName || '').trim();
            if (!name) return;
            items.push({
              name,
              tag: (tags[idx] || '').trim(),
              isChanged: !!week.changedCells[`${def.key}:${idx}`]
            });
          });

          if (items.length > 0) {
            roleBlocks.push({ label: def.label, icon: def.icon, items });
          }
        });

        const spStyle = SPEAKER_STYLES[week.speakerType] || SPEAKER_STYLES.church;
        const eventsList = Array.isArray(week.events) ? week.events : [];
        const card = document.createElement('article');
        card.className = 'bg-white rounded-[26px] border border-[#D4E4D6] shadow-sm overflow-hidden';

        // Special events pills (all >= 16px)
        const eventsHtml = eventsList.length > 0
          ? `<div class="pt-2.5 flex flex-wrap gap-2">
              ${eventsList.map(ev => {
                const cCfg = EVENT_COLORS[ev.color] || EVENT_COLORS.red;
                return `<span class="text-[16px] font-bold px-3 py-1 rounded-xl ${cCfg.badgeBg}">${escapeHtml(ev.text)}</span>`;
              }).join('')}
            </div>`
          : '';

        // Roles list in clean iOS Inset Grouped / Material 3 List style (all >= 16px)
        const rolesHtml = roleBlocks.length > 0
          ? roleBlocks.map(block => {
              const peopleHtml = block.items.map(it => {
                const tagBadge = it.tag
                  ? `<span class="inline-block ml-1.5 px-2.5 py-0.5 rounded-lg bg-[#EEF6EE] text-[#2C5E34] border border-[#C5DEC8] text-[16px] font-bold">${escapeHtml(it.tag)}</span>`
                  : '';
                if (it.isChanged) {
                  return `<span class="inline-flex items-center flex-wrap bg-[#E53E3E] text-white px-2.5 py-0.5 rounded-xl text-[17px] font-black">${escapeHtml(it.name)}・異動</span>${tagBadge}`;
                }
                return `<span class="inline-flex items-center flex-wrap"><span class="text-[18px] font-bold text-[#1E3323]">${escapeHtml(it.name)}</span>${tagBadge}</span>`;
              }).join('<span class="text-[17px] text-[#9BBF9F] mx-1.5">、</span>');

              return `
                <div class="py-3.5 px-4 border-b border-[#EDF3EE] last:border-b-0 flex flex-col gap-1.5">
                  <div class="flex items-center gap-2 text-[16px] font-black text-[#3D7A47]">
                    <span>${block.icon}</span>
                    <span>${block.label}</span>
                  </div>
                  <div class="pl-7 leading-relaxed">${peopleHtml}</div>
                </div>
              `;
            }).join('')
          : `<div class="py-6 text-center text-[17px] text-[#6C8570] font-bold">本週尚無同工排班名單</div>`;

        card.innerHTML = `
          <!-- Card Header: Date + Speaker + Topic + Events -->
          <div class="p-5 bg-[#FCFDFB] border-b border-[#E3EDE4] space-y-2.5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <span class="text-[24px] font-black text-[#2C5E34] tracking-tight">${escapeHtml(week.date)}</span>
              <span class="text-[18px] font-black px-3.5 py-1 rounded-2xl border-2 ${spStyle.cls}">
                ${escapeHtml(week.speaker) || '講員待定'}
              </span>
            </div>
            ${week.topic ? `<div class="text-[18px] font-bold text-[#1E5B70] leading-snug">${escapeHtml(week.topic)}</div>` : ''}
            ${eventsHtml}
          </div>

          <!-- Worship Songs Surface Card -->
          <div class="bg-[#F2F7F2] px-5 py-3.5 border-b border-[#E3EDE4] space-y-2">
            <div class="text-[16px] font-black text-[#2C5E34]">🎵 敬拜詩歌</div>
            <div class="space-y-1.5">
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#FEF5DC] text-[#9A6700] border border-[#F4BD3E] font-black text-[16px] shrink-0">快歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.fast) || '—'}</span>
              </div>
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#E6F4F6] text-[#1E5B70] border border-[#8BC3CB] font-black text-[16px] shrink-0">慢歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.slow1) || '—'}</span>
              </div>
              <div class="flex items-baseline gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-[#E6F4F6] text-[#1E5B70] border border-[#8BC3CB] font-black text-[16px] shrink-0">慢歌</span>
                <span class="text-[17px] font-bold text-[#1E3323]">${escapeHtml(week.songs.slow2) || '—'}</span>
              </div>
            </div>
          </div>

          <!-- Grouped Ministry Roster Rows -->
          <div class="divide-y divide-[#EDF3EE]">
            ${rolesHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-text').textContent = msg;
      box.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        box.classList.add('translate-y-24', 'opacity-0');
      }, 2600);
    }

    function resizeRosterViewport() {
      const viewport = document.getElementById('roster-scroll');
      const firstRow = viewport.querySelector('thead tr');
      viewport.style.setProperty('--roster-top',Math.max(0,viewport.getBoundingClientRect().top)+'px');
      if (firstRow.offsetHeight) viewport.style.setProperty('--roster-first-row',firstRow.getBoundingClientRect().height+'px');
    }
    window.addEventListener('resize',resizeRosterViewport);
    window.addEventListener('clc-admin-changed', () => {
      if (!canManageRoster()) toggleSuperUserModal(false);
      renderRosterSettings();
      renderDesktopTable();
    });
    window.addEventListener('DOMContentLoaded', () => {
      setVersionStatus(versionStatus, false);
      renderRosterSettings();
      resetRosterSearch();
      resizeRosterViewport();
      if (typeof ResizeObserver !== 'undefined') {
        const observer = new ResizeObserver(resizeRosterViewport);
        document.querySelectorAll('body > header, #roster-search, .roster-table thead tr:first-child').forEach(box => observer.observe(box));
      }
      updateQuarterHeaderAndTabs();
      renderDesktopTable();
      renderMobileCards();
    });
  </script>

  <script src="header.js?v=20261126-serve"></script>
</body></html>
